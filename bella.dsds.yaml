  - kind: component
    id: button
    name: Button
    description: "Buttons with real hierarchy: a flat primary plate on background/brand (ink in BELLA, near-white in BELLA dark; light blue #63b4e8 with a navy label in Chip), no gloss, no key edge, no shadow, never lifts; corner radius/lg (pill in BELLA, 8 in Chip), an outlined secondary, an ink text tier; one primary per view (brand refresh, 2026-09-22: no accent colour on buttons; the primary was flattened by the shared look, 8 Nov 2026). Labels are the theme's body face (DM Sans in BELLA, Lexend in Chip), 16 on a 22 line, weight 600, sentence case, never Unique."
    metadata:
      origin:
        method: extracted
        author: machine-assisted
        note: Extracted from the BELLA contract in tokens/contracts.json and the component’s own TSDoc. Not hand-written for this document.
      reviewed:
        - by: human:elleta
          note: "Measured 20 Nov 2026: primary label 13.90:1 on the plate in BELLA light and dark, 7.12:1 in Chip light and dark; on the hover plate 7.34:1 BELLA light, 9.54:1 BELLA dark, 7.54:1 Chip (AAA). Secondary label 16.13:1 light / 10.99:1 dark on the card. Control border 5.16:1 light on the card. Focus ring 4px with a 4px gap, outside: blue/600 #1865bb in the light themes (3.62:1 on the page), #63b4e8 in the dark themes (9.22:1). Focus-visible only. busy: aria-busy and aria-disabled while the job it started runs; clicks wait, focus stays; the turning icon is decorative and holds still under reduced motion."
      tags:
        - component
        - button
    sections:
      - kind: guidelines
        for: all
        framing: when-to-use
        title: Where it is used
        items:
          - level: may
            statement: Hero CTA
          - level: may
            statement: Card 'Read more' action
          - level: may
            statement: Form submit
          - level: may
            statement: Contact send
          - level: may
            statement: Nav call to action (shape pill)
          - level: may
            statement: The primary contact CTA reads "Let's talk" (brand refresh, 2026-09-22)
      - kind: guidelines
        for: all
        title: Do not
        items:
          - level: must-not
            statement: "Do not render more than one primary per view: the flat primary plate is the single main action"
          - level: must-not
            statement: "Do not use for filters, toggles, or sort: that is FilterChip / SegmentedControl / Select territory"
          - level: must-not
            statement: Do not set labels in Unique at any size
          - level: must-not
            statement: "Do not build a neutral tier: it is retired"
          - level: must-not
            statement: "Do not lift a button on hover: lift is reserved for cards; hover is the label roll"
          - level: must-not
            statement: "Do not add the trace ring to a button: the trace is Card's affordance"
      - kind: definitions
        for: all
        title: At rest
        description: "One job per state. At rest the primary is a calm flat plate and a label: no gloss, no key edge, no shadow. Hover and focus-visible roll the label and shift the colour on every tier (primary plate, secondary fill, tertiary label); the button never lifts. Active is a small press down, primary only. Reduced motion: colour only, the shift stays and the roll and press drop. audit:quality asserts the invariants on every story rendering the component (root carries data-bella-component=button)."
        context: anatomy
        items:
          - term: flat plate
            definition: "Trigger: rest. Paints at rest."
          - term: no gloss, no key edge
            definition: "Trigger: rest. Paints at rest."
          - term: no shadow
            definition: "Trigger: rest. Paints at rest."
