schemaVersion: "0.20.1"
$schema: https://designsystemdocspec.org/v0.20.1/dsds.bundled.yaml
name: BELLA
entries:
  - kind: system
    id: bella
    name: BELLA
    description: "The design system for ctrl_alt_design: a token contract plus a React component set, editorial by stance."
    purpose: Keeps the work editorial, deliberate, and recognizably not-AI-generic across elleta.design, CHIP, and everything downstream.
    metadata:
      context: "Documented in DSDS from the files that already govern BELLA: tokens/bella.json, AGENTS.md, tokens/component.json and the component sources. No value or rule here is new."
      origin:
        method: extracted
        author: machine-assisted
      updated:
        date: "2026-09-10"
        note: First DSDS pass over BELLA 0.3.0 plus the unreleased component batch.
      tags:
        - design-system
      organization: ctrl_alt_design
      url: https://github.com/emcdanie/bella
      version: 0.3.0
      platforms:
        - react
      license: MIT
    sections:
      - kind: guidelines
        for: all
        framing: when-to-use
        title: Inheritance
        items:
          - level: must
            statement: A repo that installs BELLA MUST inherit its rules; a downstream ruleset may only extend or tighten them, never relax them.
            checkedBy: manual
          - level: must
            statement: When a consuming repo’s rules conflict with BELLA’s, BELLA wins. Flag the conflict; do not silently resolve it.
            checkedBy: manual
      - kind: guidelines
        for: all
        title: Token-first
        items:
          - level: must
            statement: Reference tokens by path (`color.brand.ochre`, `spacing.4`, `typography.font-size.base`). Consuming apps read `tokens/bella.json` as the source of truth.
            checkedBy: manual
          - level: must
            statement: When the token you need does not exist yet, stop and ask.
            checkedBy: manual
          - level: must
            statement: A value written `TBD` in the token JSON is a genuine unknown. Stop and ask; do not fill it in.
            checkedBy: manual
          - level: must-not
            statement: Never hard-code a hex value, an arbitrary pixel number, or a one-off font size. Colour, spacing, radius, and type MUST resolve through a BELLA token.
            checks:
              - href: ./scripts/audit-quality-docs.mjs
                rel: lint-rule
                role: audit:quality
            checkedBy: automated
      - kind: guidelines
        for: all
        title: Aesthetic stance
        description: Editorial. Confident. Closer to a magazine or a well-set book than a SaaS dashboard.
        items:
          - level: should
            statement: When in doubt, the answer is more type, less chrome. Asymmetry is fine, often better.
            checkedBy: manual
          - level: should-not
            statement: Avoid gradient-on-gradient hero blobs, rounded-and-pastel-everything "friendly AI" UI, emoji in headings, centred everything, and stock iconography where typography would do.
            checkedBy: manual
    refs:
      - href: ./AGENTS.md
        rel: external-link
        role: the prose rules this document is extracted from
      - href: ./CHANGELOG.md
        rel: external-link
        role: release history
      - to: bella-a11y
        rel: relates-to
        note: The accessibility bar every entry is held to.
