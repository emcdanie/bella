name: Drawer
lead:
  text: >-
    A panel that slides in from the left (or the right, side=right) over a scrim, or rises from the bottom as the phone sheet (side=bottom:
    full width, 24 corners on top, a decorative grab handle, no divider above the footer). A native modal dialog.
  source: tokens/contracts.json description, up to the first colon or semicolon
category: Layout
rendersAs: a native dialog, opened modal
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-layout-drawer--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/Drawer/Drawer.tsx
  storyTitle: Components/Layout/Drawer
props:
  - name: open
    type: boolean
    values:
      - true
      - false
    required: true
    doc: Whether the drawer is open. The drawer is a modal dialog while open.
    at: src/components/Drawer/Drawer.tsx:7
  - name: onClose
    type: () => void
    required: true
    doc: 'Called when the drawer closes itself: Esc, the Close button or a click on the scrim.'
    at: src/components/Drawer/Drawer.tsx:9
  - name: label
    figmaName: label
    type: string
    required: true
    doc: The drawer's visible title, which also names the dialog.
    at: src/components/Drawer/Drawer.tsx:11
  - name: side
    figmaName: side
    type: '''left'' | ''right'' | ''bottom'''
    values:
      - left
      - right
      - bottom
    default: left
    required: false
    doc: >-
      The edge it slides from: left for navigation (default), right for a tool panel, bottom for the phone sheet (Figma side=bottom, 22 Nov
      2026): the full width, 24 corners on top, a grab handle, rising from the bottom.
    at: src/components/Drawer/Drawer.tsx:17
  - name: size
    type: '''sm'' | ''lg'''
    values:
      - sm
      - lg
    default: sm
    required: false
    doc: >-
      Width. sm (default): 320, for navigation and filters (BellaComponents Drawer). lg: 640 from a 768 window, the full width on a phone,
      for a session's run or the terminal (CHIP · Dashboard Flow 12, 791:264033 and 791:264846). With side="bottom" it is the height: sm
      hugs the content, lg is 720 tall.
    at: src/components/Drawer/Drawer.tsx:24
  - name: children
    type: ReactNode
    required: false
    doc: The drawer's content (a NavList, filters, settings).
    at: src/components/Drawer/Drawer.tsx:26
  - name: status
    figmaName: Show status
    type: ReactNode
    required: false
    doc: 'Figma "Show status" + "Status": one line under the title ("Checks ran 2 min ago"). Missing = off.'
    at: src/components/Drawer/Drawer.tsx:28
  - name: subtitle
    type: ReactNode
    required: false
    doc: 'Figma "Show subtitle" + "Subtitle": one line under the title, above the status, the same subtle 16. Missing = off.'
    at: src/components/Drawer/Drawer.tsx:30
  - name: action
    type: ReactNode
    required: false
    doc: 'Figma "Show action" + "Action": one control in the head before Close, a tertiary Button ("New chat"). Missing = off.'
    at: src/components/Drawer/Drawer.tsx:32
  - name: onBack
    type: () => void
    required: false
    doc: 'Figma "Show back": the tertiary icon-only Back (44) at the head''s start, for a drawer opened one level down. Missing = off.'
    at: src/components/Drawer/Drawer.tsx:34
  - name: backLabel
    type: string
    default: Back
    required: false
    doc: Back's name for screen readers. Default "Back".
    at: src/components/Drawer/Drawer.tsx:36
  - name: footer
    figmaName: Show footer
    type: ReactNode
    required: false
    doc: >-
      Figma "Show footer" + Footer: actions pinned under the body, above a hairline: at most one primary Button, the rest secondary. Missing
      = off.
    at: src/components/Drawer/Drawer.tsx:38
  - name: footerNote
    type: ReactNode
    required: false
    doc: >-
      One line of helper text in the footer's own row, at the left, with the footer's actions at the right edge (CHIP drawers, 23 Nov 2026:
      one fixed place to read what the action does and act). It says what the primary action does ("Opens the plan; nothing runs until you
      approve it"). It wraps under itself in its own column; only when the drawer is too narrow for both (two buttons at 320) does the row
      break, the text above the actions, never under them. Needs `footer`. Missing = off.
    at: src/components/Drawer/Drawer.tsx:46
