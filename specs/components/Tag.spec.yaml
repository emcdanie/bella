  storyTitle: Components/Data/Tag
props:
  - name: variant
    type: '''default'' | ''accent'' | ''outline'' | ''flat'' | ''index'' | ''line'' | ''solid'''
    values:
      - default
      - accent
      - outline
      - flat
      - index
      - line
      - solid
    default: default
    required: false
    doc: >-
      Two jobs on one prop, both kept: - `"default"` / `"accent"`: the original look. `"default"` is the quiet neutral wash; `"accent"` is
      the pink fill (#E58BBB) with a near-black label, 8.13:1 (shared look, 8 Nov 2026). Retired in Figma (17 Nov: accent is gone from the
      Tag tones); kept here so existing pages render. - `"outline"` / `"flat"` / `"index"`: Figma's `style` axis (Figma calls it style; code
      cannot, `style` is the CSS prop). outline = wash and edge per tone; flat = grey fill, no edge (18 Nov "B, flat"); index = the numbered
      lane pin, number face 600; line = the surface with the tone's edge and ink (Figma style=line, every tone, re-read 21 Nov); solid = the
      tone's knockout fill, no edge, the knockout ink, number face 600 (Figma style=solid, 21 Nov publish: success, info and attention only;
      neutral has no solid yet). Every style has the small corner, none is round (21 Nov, "A, small corner"). Passing `tone` or `showDot`
      with `"default"` gives Figma's outline.
    at: src/components/Tag/Tag.tsx:24
  - name: tone
    figmaName: tone
    type: TagTone
    required: false
    doc: 'Figma "tone". Status ladder: attention waiting, info working, success done, danger failed; default neutral; count for numbers.'
    at: src/components/Tag/Tag.tsx:26
  - name: showDot
    figmaName: Show dot
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: Figma "Show dot". A 12 dot in the tone before the label.
    at: src/components/Tag/Tag.tsx:28
  - name: count
    figmaName: Show count
    type: ReactNode
    required: false
    doc: >-
      Figma "Show count" + "Count" (published 21 Nov): a number before the label, 4 apart, in the number face 600, the tone's ink. Missing =
      off.
    at: src/components/Tag/Tag.tsx:33
  - name: className
    type: string
    required: false
    doc: Extra classes on the chip.
    at: src/components/Tag/Tag.tsx:35
  - name: style
    figmaName: style
    type: CSSProperties
    required: false
    at: src/components/Tag/Tag.tsx:36
  - name: children
    figmaName: Label
    type: ReactNode
    required: false
    doc: Figma "Label".
    at: src/components/Tag/Tag.tsx:38
