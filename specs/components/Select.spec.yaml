guidance:
  lead: A styled native select for long lists. The platform draws the popup and owns the keys.
  whenToUse:
    - task: Sorting or choosing from a long list
      answer: ✓ Use Select
      visual: Select
      visualVariant: state=default
      kind: This one
    - task: Two to five visible options
      answer: → Use SegmentedControl
      visual: SegmentedControl
      kind: Instead
    - task: Filtering a list
      answer: → Use FilterChip
      visual: FilterChip
      kind: Instead
    - task: Searching the options
      answer: → Use Combobox
      visual: Combobox
      visualTexts:
        Value: Search options
      kind: Instead
  doDont:
    - do:
        rule: A segmented control for three options
        set: SegmentedControl
      dont:
        rule: A select for three options
        vp:
          state: default
        props:
          label: Repeat
          value: Weekly
  anatomyParts:
    - name: Label
      at: centre
      side: left
    - name: Leading icon, optional
      layer: Leading
      side: bottom
    - name: Value
      side: bottom
    - name: Chevron
      side: bottom
  inContext:
    intro: A toolbar row above the list it sorts.
    stack:
      - row:
          - props:
              label: Sort
              value: Newest first
      - set: ListRow
        props:
          Title: Figma check
          Description: No file key in server/.env
      - set: ListRow
        props:
          Title: Token audit
          Description: 3 ghost tokens found
      - set: ListRow
        props:
          Title: Spec export
          Description: Ready to hand off
  doDontIntro: Pick by how many options there are.
  anatomyProps:
    leading: true
  contrastVarMap: {}
  contrastSkip: []
  contrastOnly: true
  contrastExtra:
    - label: Selected value
      foreground: '--color-semantic-text-primary'
      background: '--color-semantic-surface'
      bar: AA
    - label: Label
      foreground: '--color-semantic-text-body'
      background: '--color-semantic-surface'
      bar: AA
    - label: control border on surface
      foreground: '--color-semantic-border-strong'
      background: '--color-semantic-surface'
      bar: NON_TEXT
    - label: chevron on field
      foreground: '--color-semantic-text-secondary'
      background: '--color-semantic-surface'
