guidance:
  lead: One status word in a pill. The word carries the state; the tint only backs it up.
  whenToUse:
    - task: Showing where a row or card stands
      answer: ✓ Use StatusPill
      visual: StatusPill
      visualVariant: variant=attention
      kind: This one
    - task: Showing that work is done
      answer: ✓ Use StatusPill success
      visual: StatusPill
      visualVariant: variant=success
      kind: This one
    - task: Labelling a topic or category
      answer: → Use Tag
      visual: Tag
      visualVariant: variant=default
      kind: Instead
    - task: A bare state mark beside a title
      answer: → Use StatusDot
      visual: StatusDot
      kind: Instead
  doDont:
    - do:
        rule: One state word
        text: Waiting on you
      dont:
        rule: Never an action
        text: Click to approve
    - do:
        rule: Short and plain
        text: Failed
      dont:
        rule: Never a sentence
        text: Failed to publish the changelog
  anatomyParts:
    - name: Pill
      layer: root
      at: bottom
      side: right
    - name: Label
      layer: Label
      at: centre
      side: left
  inContext: []
  doDontIntro: A status is one plain word, never an action or a sentence.
  propSpecimens:
    variant:
      - vp:
          variant: accent
      - vp:
          variant: success
  contrastSample: Aa
  contrastExtra:
    - label: Accent label
      foreground: '--component-status-pill-accent-foreground'
      background: '--component-status-pill-accent-background'
      bar: AA
    - label: Success label
      foreground: '--component-status-pill-success-foreground'
      background: '--component-status-pill-success-background'
      bar: AA
    - label: Info label
      foreground: '--component-status-pill-info-foreground'
      background: '--component-status-pill-info-background'
      bar: AA
    - label: Neutral label
      foreground: '--component-status-pill-neutral-foreground'
      background: '--component-status-pill-neutral-background'
      bar: AA
    - label: Attention label
      foreground: '--component-status-pill-attention-foreground'
      background: '--component-status-pill-attention-background'
      bar: AA
    - label: Danger label
      foreground: '--component-status-pill-danger-foreground'
      background: '--component-status-pill-danger-background'
      bar: AA
    - label: Quiet label
      foreground: '--component-status-pill-quiet-foreground'
      background: '--component-status-pill-quiet-background'
      bar: AA
    - label: Serving label
      foreground: '--component-status-pill-serving-foreground'
      background: '--color-semantic-surface-card'
      bar: AA
    - label: Serving outline
