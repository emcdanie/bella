notApplicable:
  - section: Sizes
    why: no size prop in src/components/Tabs/Tabs.tsx
guidance:
  lead: Switches between panels that share one place. Each tab owns one panel.
  whenToUse:
    - task: Switching between panels
      answer: ✓ Use Tabs
      visual: Tabs
      kind: This one
    - task: Switching a view of the same content
      answer: → Use SegmentedControl
      visual: SegmentedControl
      kind: Instead
    - task: Filtering a list
      answer: → Use FilterChip
      visual: FilterChip
      kind: Instead
    - task: Going to another page
      answer: → Use Link
      visual: Link
      kind: Instead
  doDont:
    - do:
        rule: Name each tab in a word or two
        text: Workspace
        state: default
      dont:
        rule: Never a sentence
        text: Open workspace panel
        state: default
  anatomyParts:
    - name: Tab list
      layer: root
      at: bottom
      side: right
    - name: Label
      at: centre
      side: left
    - name: Run dot
      at: centre
      side: bottom
    - name: Selected bar
      at: bottom
      side: left
  inContext: []
  whenColumns: 2
  contrastVarMap:
    '--component-tabs-indicator': color/chip-ui/action-deep
  contrastSample: Workspace
  contrastSkip:
    - '--color-semantic-text-primary'
    - '--color-semantic-text-secondary'
    - '--color-semantic-border-strong'
    - '--component-tabs-indicator'
  contrastExtra:
    - label: Tab label
      foreground: '--color-semantic-text-secondary'
      background: '--color-semantic-surface-card'
      bar: AA
    - label: Selected label
      foreground: '--color-semantic-text-primary'
      background: '--color-semantic-surface-card'
      bar: AA
    - label: Selected bar
      foreground: '--component-tabs-indicator'
      background: '--color-semantic-surface-card'
      bar: NON_TEXT
    - label: Focus ring
      foreground: '--color-semantic-focus-ring'
      background: '--color-semantic-surface-card'
      bar: NON_TEXT
  a11yBracket: 44
  a11yTag: 16px padding each side
  a11yRule: One tab stop; arrows move between tabs, Home and End jump to the ends.
  a11yChips:
    - kind: Role
      value: tablist
    - kind: Name
      value: “Workspaces”
    - kind: Focus order
      value: Tab stop
      num: '1'
  motionRows:
    - title: Hover
      set: Tab
      before:
        variant: state=default, status=none
        caption: Rest
      after:
        variant: state=hover, status=none
        caption: Hovered
      plain: Background and colour fade.
    - title: Select
      set: Tab
      before:
        variant: state=default, status=none
        caption: Rest
      after:
        variant: state=selected, status=none
        caption: Selected
      plain: Colour fades; the bar appears.
  codeExample:
    import: import Tabs from '@bella/components/Tabs/Tabs';
    lines: 44-52 (Harness)
    code: |-
      import { tabPanelProps } from '@bella/components/Tabs/Tabs';

      <Tabs tabs={tabs} value={value} onChange={setValue} label="Workspaces" idBase="ws" />
      <div {...tabPanelProps('ws', 'health', value === 'health')}>
        <p>The Health panel.</p>
      </div>
  propNotes:
    onChange: Called with the new id
    label: Names the tablist
    idBase: Unique on the page
  propSpecimens:
    tabs:
      - set: Tabs
    value:
      - set: Tab
        variant: state=selected, status=none
  propExtra:
    - name: tabs[].id
      values: string
      default: none
      note: Ties a tab to its panel
    - name: tabs[].label
      values: string
      default: none
      note: The words on the tab
    - name: tabs[].status
      values: running · idle
      default: none
      specimens:
        - set: Tab
          variant: state=default, status=running
        - set: Tab
          variant: state=default, status=idle
    - name: tabs[].count
      values: number
      default: none
      specimens:
        - set: Tab
          variant: state=default, status=none
          props:
            Show count: true
    - name: tabs[].icon
      values: icon name
      default: none
      specimens:
        - set: Tab
          variant: state=default, status=none
          props:
            Show icon: true
  anatomyScaleWidth: 700
