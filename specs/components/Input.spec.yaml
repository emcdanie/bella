guidance:
  lead: Labelled free-text entry. The label is always shown and the error always says why.
  whenToUse:
    - task: Free text (name, email, message)
      answer: ✓ Use Input
      visual: Input
      visualVariant: state=default, disabled=false, error=false, multiline=false
      kind: This one
    - task: Picking from known options
      answer: → Use Select
      visual: Select
      kind: Instead
    - task: Searching a long list
      answer: → Use Combobox
      visual: Combobox
      visualTexts:
        Value: Search options
      kind: Instead
    - task: Choosing a number in a range
      answer: → Use Slider
      visual: Slider
      kind: Instead
  doDont:
    - do:
        rule: Say what to fix, beside the field
        vp:
          error: 'true'
        texts:
          Message: Add an @, like you@studio.com
      dont:
        rule: Say only that it failed
        vp:
          error: 'true'
        texts:
          Message: Invalid
    - do:
        rule: Show an example in the placeholder
        props:
          label: Email
          value: you@studio.com
      dont:
        rule: Put the instructions in the placeholder
        props:
          label: Email
          value: Type your work address here
  anatomyParts:
    - name: Label
      at: top
      side: left
    - name: Field
      at: top
      side: left
    - name: Value
      at: centre
      side: left
    - name: Hint or error
      layer: HelperText
      at: bottom
      side: left
  inContext:
    intro: A contact form, three fields.
    form:
      - props:
          label: Name
          value: Your name
          hint: false
      - props:
          label: Email
          value: you@studio.com
          required: true
      - vp:
