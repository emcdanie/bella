    required: false
    doc: Figma "tone". Status colours for status only.
    at: src/components/Progress/Progress.tsx:77
  - name: fill
    type: number
    default: '0'
    required: false
    doc: 'Figma "Fill · value" (bar, ring): 0 to 100.'
    at: src/components/Progress/Progress.tsx:79
  - name: target
    type: number
    default: '0'
    required: false
    doc: 'Figma "Target · target" (bar): 0 to 100.'
    at: src/components/Progress/Progress.tsx:81
  - name: targetLabel
    type: string
    required: false
    doc: The target label in its own unit ("Target 7:1"); default "Target n%". Bar only, with showTarget.
    at: src/components/Progress/Progress.tsx:83
  - name: segments
    type: number
    default: '5'
    required: false
    doc: 'Segments only: how many steps (Figma draws 6; the gate uses 5).'
    at: src/components/Progress/Progress.tsx:85
  - name: done
    type: number
    default: '0'
    required: false
    doc: 'Segments only: how many are done.'
    at: src/components/Progress/Progress.tsx:87
  - name: drawIn
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      Draws in once when it first appears: the bar grows, the ring sweeps, the segments fill, to the value on motion/duration/450 and
      motion/easing/out; the target is there before the mark arrives. Reduced motion: drawn at once. A demo for Health charts (21 Nov:
      "should we not put motion on the graphs??"), off by default.
    at: src/components/Progress/Progress.tsx:92
  - name: callout
    type: boolean | string
    default: false
    required: false
    doc: >-
      The chart callout (22 Nov, CHIP chart language): hover or keyboard focus on the bar shows BELLA's Tooltip 16 under the track, pointing
      up, with the amount and the target ("60% · target 90%"). true writes that text from `value` and `target`; a string says it instead ("4
      of 5 · target 80%"). On, the bar takes keyboard focus. Off by default, so rows of bars add no tab stops.
    at: src/components/Progress/Progress.tsx:99
  - name: summary
    type: string
    required: false
    doc: >-
      The chart's one-line summary (22 Nov reading: every chart has a summary behind it), read as the bar's description (aria-describedby)
