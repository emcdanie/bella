guidance:
  lead: Names an icon-only control on hover and focus. A rich tooltip adds a short hover card.
  whenToUse:
    - task: Naming an icon-only button
      answer: ✓ Use Tooltip
      visual: Tooltip
      visualVariant: kind=plain, placement=bottom
      kind: This one
    - task: Naming the keys of a shortcut
      answer: → Use Kbd
      visual: Kbd
      kind: Instead
    - task: Something people click
      answer: → Use Button
      visual: Button
      kind: Instead
  doDont:
    - do:
        rule: Same words as the button's name
        text: Check again
      dont:
        rule: Never a sentence
        text: Click here to check the status again
  doDontIntro: A few words that name the button, nothing more.
