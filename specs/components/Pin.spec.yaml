  - name: number
    type: ReactNode
    required: false
    doc: >-
      The number on the disc. Missing = Figma label=false: a 28 disc with a 10 dot in the tone's status colour (her "On the stage" pins).
      Then say what it marks nearby or in ariaLabel.
    at: src/components/Pin/Pin.tsx:7
  - name: variant
    type: '''yellow'' | ''pink'' | ''blue'' | ''red'' | ''green'''
    values:
      - yellow
      - pink
      - blue
      - red
      - green
    default: pink
    required: false
    doc: The pop colour of the ring. It groups pins; it never means a status.
    at: src/components/Pin/Pin.tsx:9
  - name: pinStyle
    type: '''dot'' | ''solid'' | ''comment'''
    values:
      - dot
      - solid
      - comment
    default: dot
    required: false
    doc: >-
      Figma "style". dot (default): the card disc with a pop-colour ring. solid: the disc filled in the tone with an ink number and a 2px
      surface edge (anatomy pins, the Tour step). comment: a comment's pin as Figma draws it (Elleta, 23 Nov 2026: "I want my comments to
      look like the Figma ones"): the author's initials on a pink teardrop (pink is for annotations) whose point (bottom left) marks the
      spot, with a white edge and the card's shadow; pass the initials as `number`.
    at: src/components/Pin/Pin.tsx:11
  - name: label
    type: ReactNode
    required: false
    doc: The word beside the number. Without one, say what the pin means nearby.
    at: src/components/Pin/Pin.tsx:13
  - name: onClick
    type: MouseEventHandler<HTMLButtonElement>
    required: false
    doc: Makes the pin a button with a 44px box.
    at: src/components/Pin/Pin.tsx:15
  - name: active
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'Lit: its match is hovered or focused elsewhere (the anatomy list, the stage chip). The pin pops.'
    at: src/components/Pin/Pin.tsx:17
  - name: ariaLabel
    type: string
    required: false
    doc: Accessible name, for a clickable pin with no label.
    at: src/components/Pin/Pin.tsx:19
  - name: className
    type: string
