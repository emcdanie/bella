# Generated by scripts/spec-build.mjs. Do not edit by hand except the `guidance:` block.
name: Button
lead:
  text: Buttons with real hierarchy.
  source: tokens/component.json description, up to the first colon or semicolon
category: Actions
rendersAs: a button, or one anchor with href
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-button--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/Button/Button.tsx
  storyTitle: Components/Button
props:
  - name: variant
    type: '''primary'' | ''secondary'' | ''tertiary'''
    values:
      - primary
      - secondary
      - tertiary
    default: secondary
    required: false
    doc: >-
      Tier. `"primary"` is the flat ink plate, no shadow, never lifts; render at most ONE per view. `"secondary"` is the flat accent
      outline. `"tertiary"` is the text tier: accent and underlined, nothing else. The neutral tier is retired; there is no fourth tier.
    at: src/components/Button/Button.tsx:11
  - name: shape
    type: '''default'' | ''pill'''
    values:
      - default
      - pill
    default: default
    required: false
    doc: Outline shape. `"default"` is the 12px radius every tier shares; `"pill"` rounds the ends fully (e.g. a nav call to action).
    at: src/components/Button/Button.tsx:16
  - name: size
    type: '''default'' | ''sm'''
    values:
      - default
      - sm
    default: default
    required: false
    doc: >-
      `"sm"` is a 36px box with 14px sides (Elleta, 11 Nov 2026) for dense rows and tool bars. The label stays 16px and the 44px tap area
      stays, extended invisibly around the box. With `iconOnly` it is a 36 circle.
    at: src/components/Button/Button.tsx:22
  - name: iconOnly
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      A 44px circle holding one Icon, with a round focus ring (BellaComponents, 11 Nov 2026). Secondary or primary only (the text tier is
      its underline). Needs `ariaLabel`, and a Tooltip with the same words.
    at: src/components/Button/Button.tsx:28
  - name: href
    type: string
    required: false
    doc: Renders the button as ONE anchor. External (http...) hrefs open in a new tab.
    at: src/components/Button/Button.tsx:30
  - name: onClick
    type: () => void
    required: false
    doc: Renders a real button. Ignored when `href` is set.
    at: src/components/Button/Button.tsx:32
  - name: type
    type: '''button'' | ''submit'''
    values:
      - button
      - submit
    default: button
    required: false
    doc: Button element type; `"submit"` for forms.
    at: src/components/Button/Button.tsx:34
  - name: disabled
    type: boolean
    values:
      - true
      - false
    required: false
    doc: 'Disabled state: muted surface, no elevation, no affordances. Buttons only, not links.'
    at: src/components/Button/Button.tsx:36
  - name: linkComponent
    type: ElementType
    default: a
    required: false
    doc: Component used to render internal links; inject your router's Link (e.g. next/link) at the consumer; defaults to a plain anchor.
    at: src/components/Button/Button.tsx:41
  - name: ariaLabel
    type: string
    required: false
    doc: Accessible name when the visible label isn't the right name.
    at: src/components/Button/Button.tsx:43
  - name: ariaExpanded
    type: boolean
    values:
      - true
      - false
    required: false
    doc: 'For a button that shows or hides content: whether that content is open (aria-expanded).'
    at: src/components/Button/Button.tsx:45
  - name: ariaHaspopup
    type: '''dialog'''
    values:
      - dialog
    required: false
    doc: For a button that opens a dialog (aria-haspopup).
    at: src/components/Button/Button.tsx:47
  - name: className
    type: string
    required: false
    doc: Extra classes on the control.
    at: src/components/Button/Button.tsx:49
  - name: children
    type: ReactNode
    required: false
    at: src/components/Button/Button.tsx:50
