guidance:
  lead: The only way BELLA draws an icon. One Iconoir set, always the colour of the text around it.
  whenToUse:
    - task: A glyph beside or inside a control
      answer: ✓ Use Icon
      visual: Icon
      visualVariant: name=Check, size=md, tone=primary
      kind: This one
    - task: Naming an icon-only button
      answer: → Add a Tooltip
      visual: Tooltip
      kind: Instead
    - task: A word that labels or categorises
      answer: → Use Tag
      visual: Tag
      visualVariant: variant=default
      kind: Instead
    - task: Showing a state
      answer: → Use StatusPill
      visual: StatusPill
      visualVariant: variant=success
      kind: Instead
  doDont: []
  anatomyParts:
    - name: Glyph
      layer: Glyph
      at: centre
      side: right
  inContext: []
  contrastSample: Icon
  contrastExtra:
    - label: Muted icon on a card
      foreground: '--color-semantic-icon-muted'
      background: '--color-semantic-surface-card'
      bar: NON_TEXT
    - label: Icon in body ink on a card
      foreground: '--color-semantic-text-body'
      background: '--color-semantic-surface-card'
      bar: NON_TEXT
  a11yBracket: 20
  ariaLine: false
  a11yRule: Decorative by default (hidden from screen readers). With a label it is an image with a name.
