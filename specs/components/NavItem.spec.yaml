description: >-
  Purpose One link inside NavList.



  Use inside NavList only.



  Don't use on its own; a wash alone to mark current.



  States default: text-secondary label. hover: label text-primary on the surface-inset wash (NavList.module.css:97-99). current: label and
  badge text-primary on the border-subtle wash. focus: focus-ring stroke (3px).



  iconOnly=true: a 44x44 icon-only item for a narrow rail (CHIP sidebar, 15 Nov). Label stays set: it is the accessible name (aria-label)
  and the tooltip text; the badge is not shown.



  Parts Icon (Icon instance, Show icon) · Label · Badge (Show badge).



  Code import { NavList } from 'bella'. Props: One entry in groups[].items: label → label · badge → badge · Glyph → icon · state=current →
  current. Tokens: --component-nav-list-border-radius, --component-nav-list-current-background, --component-nav-list-font-family,
  --component-nav-list-font-size, --component-nav-list-label-font-family, --component-nav-list-label-font-size and 1 more component tokens.
  A11y: Renders: link, button, navigation landmark, list. Verified 2026-10-03: a nav landmark with a required aria-label; groups with a
  heading are lists labelled by it; the current item is aria-current=page.



  Links GitHub · Storybook
