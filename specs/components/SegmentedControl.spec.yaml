    type: '{ value: string; label: string; icon?: ReactNode; ariaLabel?: string }[]'
    required: true
    doc: >-
      The visible options; a segmented control shows ALL of them. `icon` is a leading decorative slot (rendered aria-hidden, sized by the
      icon tokens); the text label always stays and carries the semantics. `ariaLabel` names a segment whose visible label is a letter (D,
      W, M, Y).
    at: src/components/SegmentedControl/SegmentedControl.tsx:11
  - name: value
    type: string
    required: true
    doc: The selected value; selection lives in aria-current, not just paint.
    at: src/components/SegmentedControl/SegmentedControl.tsx:13
  - name: onChange
    type: '(value: string) => void'
    required: true
    at: src/components/SegmentedControl/SegmentedControl.tsx:14
  - name: label
    type: string
    required: true
    doc: 'Accessible name for the group. Required: a view switcher without a name is a mystery list.'
    at: src/components/SegmentedControl/SegmentedControl.tsx:16
  - name: stretch
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      Figma: the instance drawn at the card's width, its segments sharing it equally (Gate runs' range: D, W, M, Y; Figma "Show segment 4"
