props:
  - name: type
    type: string
    required: true
    doc: 'The tab label. The kind of thing this is: WORKFLOW, AUDIT, and so on.'
    at: src/components/ResourceCard/ResourceCard.tsx:8
  - name: title
    type: string
    required: true
    doc: The resource's name. Renders at the card-title floor, never smaller.
    at: src/components/ResourceCard/ResourceCard.tsx:10
  - name: description
    type: string
    required: true
    doc: One or two lines. It clamps at two, so write to two.
    at: src/components/ResourceCard/ResourceCard.tsx:12
  - name: href
    type: string
    required: true
    doc: Where the card goes. The whole card is one link.
    at: src/components/ResourceCard/ResourceCard.tsx:14
  - name: cover
    type: ReactNode
    required: false
    doc: The file-window preview that fills the cover well.
    at: src/components/ResourceCard/ResourceCard.tsx:16
  - name: statusLabel
    type: string
    required: false
    doc: >-
      Current state, e.g. "Live". The dot beside it is deliberately neutral: BELLA has no status colour ladder yet (issue #1), and inventing
      one here would be a colour nobody can defend.
    at: src/components/ResourceCard/ResourceCard.tsx:22
  - name: accent
    type: string
    required: false
    doc: Identity colour, passed through to Card.
    at: src/components/ResourceCard/ResourceCard.tsx:24
  - name: linkComponent
    type: ElementType
    required: false
    doc: Router Link for internal hrefs; injected by the consumer, defaults to an anchor.
    at: src/components/ResourceCard/ResourceCard.tsx:26
  - name: className
    type: string
    required: false
    doc: Extra classes on the card root.
    at: src/components/ResourceCard/ResourceCard.tsx:28
  - name: style
    type: CSSProperties
    required: false
    at: src/components/ResourceCard/ResourceCard.tsx:29
