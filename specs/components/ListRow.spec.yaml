guidance:
  lead: 'One work item: a status with a word, a title, one line of why and one action.'
  whenToUse:
    - task: A list of things to do, each with one action
      answer: ✓ Use ListRow
      visual: ListRow
      visualVariant: state=default
      kind: This one
    - task: Many columns of the same facts
      answer: → Use DataTable
      visual: DataTable
      kind: Instead
    - task: One headline figure
      answer: → Use Stat
      kind: Instead
    - task: A card the reader opens
      answer: → Use ResourceCard
      kind: Instead
  doDont: []
  anatomyParts:
    - name: Title
      layer: Title
      at: top
    - name: Action
      layer: Action
      at: centre
      side: right
    - name: Status
      layer: Status
      at: centre
      side: bottom
    - name: Description
      layer: Description
      at: bottom
      side: bottom
  inContext: []
  contrastVarMap:
    '--component-list-row-title-color': color/semantic/text-primary
    '--component-list-row-description-color': color/semantic/text-body
  contrastSkip: []
  a11yBracket: 44
  a11yRule: The row has no target of its own; its action brings a 44px box.
  a11yChips:
    - kind: Role
      value: listitem in a list
    - kind: Name
      value: the title
    - kind: Focus order
      value: The action
      num: '1'
  motionRows: []
  propNotes:
    title: What the item is
    description: One line of why it matters
    status: A StatusPill, with its word
    action: One Button, ActionChip or Link
    titleAs: Heading level when the page needs one
  anatomyScaleWidth: 560
  ariaLine: false
  whenColumns: 2
  a11ySpecimenWidth: 440
  codeExample:
    code: <ListRow title="Figma check" description="No file key in server/.env" />
    lines: '52'
  codeOnly:
    - name: titleAs
      why: DOM element of the title (span or heading); nothing to draw
