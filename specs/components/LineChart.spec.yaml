name: LineChart
lead:
  text: A trend over time.
  source: tokens/contracts.json description, up to the first colon or semicolon
category: Data
rendersAs: null
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-data-linechart--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/LineChart/LineChart.tsx
  storyTitle: Components/Data/LineChart
props:
  - name: points
    type: LineChartPoint[]
    required: true
    doc: One point per step, left to right. Fewer than two points shows the empty state.
    at: src/components/LineChart/LineChart.tsx:18
  - name: label
    type: string
    required: true
    doc: What the chart is, for assistive tech and the table caption ("Audit score").
    at: src/components/LineChart/LineChart.tsx:20
  - name: tone
    type: '''success'' | ''warning'' | ''danger'' | ''info'' | ''neutral'' | ''brand'''
    values:
      - success
      - warning
      - danger
      - info
      - neutral
      - brand
    default: brand
    required: false
    doc: >-
      Semantic colour of the line, area and scrubber: success, warning, danger, info, neutral or brand. Status colours keep their meaning on
      every page; the callout and summary carry the meaning in words.
    at: src/components/LineChart/LineChart.tsx:22
  - name: area
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: The soft gradient under the line, fading from the tone to nothing at the baseline.
    at: src/components/LineChart/LineChart.tsx:24
  - name: unit
    type: string
    required: false
    doc: The unit after each value ("%", "ms", "runs").
    at: src/components/LineChart/LineChart.tsx:26
  - name: baseline
    type: '''zero'' | ''auto'''
    values:
      - zero
      - auto
    default: zero
    required: false
    doc: >-
      zero (default): the scale starts at zero. auto: the scale fits the data, for a chart about change; it must come with `baselineReason`,
      which is printed under the chart.
    at: src/components/LineChart/LineChart.tsx:28
  - name: baselineReason
    type: string
    required: false
    doc: >-
      Why the scale does not start at zero ("Shows change in score, not the score"). Required with baseline="auto" and printed under the
      chart.
    at: src/components/LineChart/LineChart.tsx:30
  - name: grid
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: Dashed thin gridlines (full variant).
    at: src/components/LineChart/LineChart.tsx:32
  - name: scrubber
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: 'The scrubber: hover, touch drag, and the arrow keys, Home and End move it; Escape clears it. Off = a plain line.'
    at: src/components/LineChart/LineChart.tsx:34
  - name: callout
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: The callout above the scrubber (value, label and the change against the reference).
    at: src/components/LineChart/LineChart.tsx:36
  - name: reference
    type: '''previous'' | number'
    default: previous
    required: false
    doc: 'What the change in the callout is measured against: the previous point (default), or a number (a target or last week''s value).'
    at: src/components/LineChart/LineChart.tsx:38
  - name: selectedIndex
    type: number | null
    required: false
    doc: The picked point's index, or null for none. Controlled when set.
    at: src/components/LineChart/LineChart.tsx:40
  - name: defaultSelectedIndex
    type: number | null
    default: 'null'
    required: false
    doc: The picked point at the start, when uncontrolled.
    at: src/components/LineChart/LineChart.tsx:42
  - name: onSelectedIndexChange
    type: '(index: number | null) => void'
    required: false
    doc: Fires when the pick changes (hover, drag, keys, Escape).
    at: src/components/LineChart/LineChart.tsx:44
  - name: draw
    type: '''none'' | ''map'' | ''pick'''
    values:
      - none
      - map
      - pick
    default: none
    required: false
    doc: >-
      Draw-in: the line draws left to right and the area fades in. map = 900ms (first draw), pick = 250ms (a refresh). none = at once.
      Replays when it changes. Reduced motion draws at once.
    at: src/components/LineChart/LineChart.tsx:46
  - name: variant
    type: '''full'' | ''compact'''
    values:
      - full
      - compact
    default: full
    required: false
    doc: >-
      full: axes, grid, scrubber and callout. compact: a sparkline for a stat card or drawer, with the line, the area and a dot on the last
      point, no axes, no grid, no scrubber.
    at: src/components/LineChart/LineChart.tsx:48
  - name: summary
    type: string
    required: false
    doc: The one-line summary under the chart, always present. Missing = written from the data.
    at: src/components/LineChart/LineChart.tsx:50
  - name: view
    type: '''chart'' | ''table'''
    values:
      - chart
      - table
    required: false
    doc: chart or table; the table is the same data. Missing = held by the chart.
    at: src/components/LineChart/LineChart.tsx:52
  - name: onViewChange
    type: '(view: ''chart'' | ''table'') => void'
    required: false
    at: src/components/LineChart/LineChart.tsx:53
  - name: showViewToggle
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'The "Show table" button. Off by default: the table is always there for screen readers, visually hidden.'
    at: src/components/LineChart/LineChart.tsx:55
  - name: xRange
    type: '[number, number]'
    required: false
    doc: The ends of the x scale, when every point has `x` (so two charts share one time axis). Missing = the first and last x.
    at: src/components/LineChart/LineChart.tsx:57
  - name: target
    type: number
    required: false
    doc: >-
      A target value: a dashed 2 wide brand line across the plot with its name at the right end. Counts toward the y scale; the summary and
      the table caption say it.
    at: src/components/LineChart/LineChart.tsx:59
  - name: targetLabel
    type: string
    required: false
    doc: The target's name on the line ("Target 70"). Missing = "Target" and the value.
    at: src/components/LineChart/LineChart.tsx:61
  - name: className
    type: string
    required: false
    at: src/components/LineChart/LineChart.tsx:62
  - name: style
    type: CSSProperties
    required: false
    at: src/components/LineChart/LineChart.tsx:63
