<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<!-- Geist for the manager chrome only. The preview iframe deliberately does
     NOT load it: stories snapshot with the system fallback, and adding a
     webfont there would invalidate every visual baseline. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap"
/>
<!-- Unique for the sidebar lockup only (BELLA, never below 24px). -->
<style>
  @font-face { font-family: 'Unique'; src: url('./fonts/Unique-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
</style>
<!-- Story UI: the manager page (?path=/workspace/) reads the server port from this tag.
     Written by `story-ui init`; `story-ui update` refreshes it. -->
<meta name="story-ui-port" content="4001">
