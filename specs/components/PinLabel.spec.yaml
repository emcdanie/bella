description: >-
  Purpose The white label at the end of a Leader: the Pin's ring and the token or part name.



  Use with a Pin and Leader of the same colour, in the order yellow, pink, blue, red.



  Don't use without a Pin and Leader; in a different colour from its Pin; as a status.



  States none: one fixed look per colour. variant changes the colour only.



  Parts Pin (exposed: Number) · Label (Geist Mono, ink).



  Code Doc-only; no React component. Props: Label → text · variant → variant (yellow, pink, blue, red). Tokens: none of its own. A11y:
  Renders: text beside a Pin. Label is ink on white; the pop colour is decoration, never the only signal.



  Links none (no story)
