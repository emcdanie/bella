      - field: paddingBottom
        variable: component/chat-bubble/default/padding-block
      - field: topLeftRadius
        variable: component/chat-bubble/default/border-radius
      - field: topRightRadius
        variable: component/chat-bubble/default/border-radius
      - field: bottomLeftRadius
        variable: component/chat-bubble/default/border-radius
      - field: bottomRightRadius
        variable: component/chat-bubble/default/border-radius
      - field: fills
        variable: component/chat-bubble/sent/background
    children:
      - name: Message
        type: TEXT
        text: Gate is green.
        size: 127x34
        tokens:
          - field: fills
            variable: component/chat-bubble/sent/foreground
          - field: fontSize
            variable: typography/font-size/body
          - field: fontFamily
            variable: typography/font-family/body
          - field: fontWeight
            variable: typography/font-weight/regular
  code: []
