guidance:
  lead: One status word in a pill. The word carries the state; the tint only backs it up.
  whenToUse:
    - task: Showing where a row or card stands
      answer: ✓ Use StatusPill
      visual: StatusPill
      visualVariant: variant=attention
      kind: This one
    - task: Showing that work is done
      answer: ✓ Use StatusPill success
      visual: StatusPill
      visualVariant: variant=success
      kind: This one
    - task: Labelling a topic or category
      answer: → Use Tag
      visual: Tag
      visualVariant: variant=default
      kind: Instead
    - task: A bare state mark beside a title
      answer: → Use StatusDot
      visual: StatusDot
      kind: Instead
  doDont:
    - do:
