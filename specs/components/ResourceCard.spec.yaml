guidance:
  lead: 'The folder card: one card per skill or document, with a type tab and a state.'
  whenToUse:
    - task: A gallery of skills or documents, each with a type and a state
      answer: ✓ Use ResourceCard
      visual: ResourceCard
      visualVariant: state=default
      kind: This one
    - task: General content in a box
      answer: → Use Card
      visual: Card
      kind: Instead
    - task: A work item with one action
      answer: → Use ListRow
      visual: ListRow
      kind: Instead
  doDont: []
  anatomyParts:
    - name: Cover
      layer: Cover
      at: top
    - name: Type tab
      layer: Tab
      at: top
      side: left
    - name: Title
      layer: Title
      at: centre
    - name: Description
      layer: Description
      at: centre
    - name: Status
      layer: Status
      at: bottom
      side: left
    - name: Open
      layer: Action
      at: bottom
      side: right
  inContext: []
  pictureOnStone: true
  codeExample:
    file: src/components/ResourceCard/ResourceCard.stories.tsx
    lines: 183-189
    import: import ResourceCard from '@bella/components/ResourceCard/ResourceCard';
    code: |-
      <ResourceCard
        type="Workflow"
        title="lock-then-verify"
        description="Two hard gates around any build."
        href="https://github.com/emcdanie/bella"
        statusLabel="Live"
        cover={<FileWindow />}
      />
  contrastOnly: true
  contrastExtra:
    - label: Title
      foreground: '--component-resource-card-default-title-foreground'
      background: '--color-semantic-surface'
      bar: AAA
    - label: Description
      foreground: '--component-resource-card-default-description-foreground'
      background: '--color-semantic-surface'
      bar: AAA
    - label: Footer status
      foreground: '--component-resource-card-default-meta-foreground'
      background: '--color-semantic-surface'
      bar: AA
    - label: Open
      foreground: '--component-resource-card-default-action-foreground'
      background: '--color-semantic-surface'
      bar: AA
    - label: Focus ring
      foreground: '--color-semantic-focus-ring'
      background: '--color-semantic-surface'
      bar: NON_TEXT
  contrastVarMap:
    '--component-resource-card-default-title-foreground': color/semantic/text-primary
    '--component-resource-card-default-description-foreground': color/semantic/text-body
    '--component-resource-card-default-meta-foreground': color/semantic/text-body
    '--component-resource-card-default-action-foreground': color/semantic/text-accent
  contrastSkip: []
  a11yBracket: 44
  a11yRule: The whole card is one link and one tab stop; Open is text inside it, not a second link.
  a11yChips:
    - kind: Role
      value: link wrapping a heading
    - kind: Name
      value: the card text; title is an h3
    - kind: Focus order
      value: The card
      num: '1'
  motionRows:
    - title: Hover
      set: ResourceCard
      before:
        variant: state=default
        caption: Rest
      after:
        variant: state=hover
        caption: Hovered
      plain: Lifts 2px and gains a shadow in 0.2 s. Reduced motion keeps the shadow only.
  propNotes:
    type: The tab label, such as WORKFLOW
    title: The resource's name
    description: One or two lines; it clamps at two
    href: Where the whole card goes
    cover: The file-window preview
    statusLabel: Current state, with a neutral dot
    accent: Identity colour, passed to Card
    linkComponent: Router link for internal hrefs
  anatomyScaleWidth: 360
  statePairs:
    - figma: focus
      code: focus-visible
