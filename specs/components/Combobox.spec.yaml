guidance:
  lead: One field over a grouped list that filters as you type. Arrow keys move, Enter chooses.
  whenToUse:
    - task: Searching or jumping through a grouped list
      answer: ✓ Use Combobox
      visual: Combobox
      visualVariant: state=open, placement=below
      visualTexts:
        Value: Find a component
        Component · 5 parts: Component
        Pattern · 2 parts: Pattern
        Buttons and links: Buttons
      kind: This one
    - task: A short fixed list, no typing
      answer: → Use Select
      visual: Select
      kind: Instead
    - task: Free text with no list
      answer: → Use Input
      visual: Input
      kind: Instead
  doDont:
    - do:
        rule: Name what the list finds
        props:
          label: Find a component
      dont:
        rule: Hide the label when nothing else names the field
        props:
          showLabel: false
    - do:
        rule: Say what the field is for in the label
        props:
          label: Search components
      dont:
        rule: Label it with the control's type
        props:
          label: Combobox
  anatomyParts:
    - name: Label
      layer: Label
      at: left
      side: left
    - name: Field
      layer: Field
      at: centre
    - name: Shortcut hint
      layer: Hint
      at: right
      side: right
    - name: List
      layer: List
      at: bottom
    - name: Active option
      layer: Option (active)
      at: right
  inContext: []
  baseProps:
    value: Find a component
  propSpecimens:
