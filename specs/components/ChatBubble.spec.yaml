  lead: One message in a thread. Sent sits right in ink; received sits left on the inset wash.
  whenToUse:
    - task: One message in a lane thread
      answer: ✓ Use ChatBubble
      visual: ChatBubble
      visualVariant: side=sent, kind=text, tail=false
      kind: This one
    - task: A question waiting on the reader
      answer: ✓ Use ChatBubble ask
      visual: ChatBubble
      visualVariant: side=received, kind=ask, tail=false
      kind: This one
    - task: The whole list of messages
      answer: → Use ChatThread
      visual: ChatThread
      kind: Instead
    - task: Someone is typing a reply
      answer: → Use TypingDots
      visual: TypingDots
      kind: Instead
  doDont:
    - do:
        rule: Ask kind for a question waiting on the reader
        vp:
          side: received
          kind: ask
          tail: 'false'
        props:
          children: Gate is green. Merge it?
      dont:
        rule: A plain bubble that hides the question
        vp:
          side: received
          kind: text
          tail: 'false'
        props:
          children: Gate is green. Merge it?
