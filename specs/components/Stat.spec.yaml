props:
  - name: label
    type: string
    required: true
    doc: What is counted, as a short Mono label.
    at: src/components/Stat/Stat.tsx:7
  - name: value
    type: string | number
    required: true
    doc: The figure. Numbers set in tabular figures.
    at: src/components/Stat/Stat.tsx:9
  - name: delta
    type: string
    required: false
    doc: Change or context under the figure (`"2 since last sync"`). Plain text; the trend arrow is added for you.
    at: src/components/Stat/Stat.tsx:11
  - name: trend
    type: '''up'' | ''down'''
    values:
      - up
      - down
    required: false
    doc: 'Direction of the delta: an arrow plus a spoken word, never colour. Omit for a neutral note.'
    at: src/components/Stat/Stat.tsx:13
  - name: series
    type: number[]
    required: false
    doc: Earlier values, oldest first, ending with the current one. Two or more draw a sparkline; fewer draw nothing.
    at: src/components/Stat/Stat.tsx:15
  - name: seriesLabel
    type: string
    required: false
    doc: 'What the sparkline says, spoken in place of the drawing. Defaults to "<label>: <first> to <last> over <n> points".'
    at: src/components/Stat/Stat.tsx:17
  - name: icon
    type: IconName
    required: false
    doc: An Iconoir glyph in a round well above the label (BellaComponents, 11 Nov 2026). Decorative.
    at: src/components/Stat/Stat.tsx:19
  - name: measure
    type: number
    required: false
    doc: How full the measure is, 0 to 1, drawn as a bar under the figure. Spoken with `measureLabel`.
    at: src/components/Stat/Stat.tsx:21
  - name: measureLabel
    type: string
    required: false
    doc: 'What the bar says, spoken in place of the drawing. Defaults to "<label>: <n>%".'
    at: src/components/Stat/Stat.tsx:23
  - name: measured
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: >-
      False when there is no real figure yet: the value reads "Not measured" and no sparkline or bar is drawn. Never invent a figure.
      Default true.
    at: src/components/Stat/Stat.tsx:25
  - name: className
    type: string
    required: false
    doc: Extra classes on the root.
    at: src/components/Stat/Stat.tsx:27
variants:
  trend:
    values:
      - up
      - down
    default: null
    at: src/components/Stat/Stat.tsx:13
