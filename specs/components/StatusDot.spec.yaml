description: >-
  Purpose Status beside a title: a 12px dot carries the tone, the word beside it carries the meaning (G4 = B, 11 Nov). Figma only for now:
  code shape="dot" draws the dot with the word hidden.



  Use status beside a title. Docs lifecycle: Done, Approved = success; In progress, Central review = info; For review, Pending development =
  attention; Outdated, Broken = danger; On hold, Not started, Idea = neutral.



  Don't use colour alone: always set the word (the Label default is Done for every tone).



  States None: static. tone success, info, attention, danger, neutral. The dot fill is the matching semantic colour (success, info,
  attention, danger; neutral is text-secondary), the word is text-body in Body/Small.



  Parts Dot slot (Dot, 12px, centred on the first text line) · Label.



  Code import { StatusPill } from 'bella'. Props: StatusPill shape="dot" (StatusPill.tsx:30-36, StatusPill.module.css:121-137) · tone →
  variant (success, info, attention, danger; neutral is the dot's default colour) · Label → children. Code draws only the dot and keeps the
  word as the accessible name; accent and serving have no Figma tone. Tokens: --component-status-dot-size, --color-semantic-success,
  --color-semantic-info, --color-semantic-attention, --color-semantic-danger, --color-semantic-text-secondary, --color-semantic-text-body,
  --spacing-2. A11y: the word carries the meaning, colour is never the only signal; the dot is decorative. Dot against the card measured 11
  Nov: attention 2.08:1 Light and 1.85:1 Chip, below the 3:1 non-text bar (decision with Elleta). Word text-body 13.32:1 (AAA).



  Links GitHub · Storybook https://emcdanie.github.io/bella/?path=/docs/components-statuspill--docs
