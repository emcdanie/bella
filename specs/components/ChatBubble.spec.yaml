# SCHEMA: best-effort, in the style of specs-cli; verify against specs-cli docs
# Generated by scripts/spec-build.mjs. Do not edit by hand except the `guidance:` block.
name: ChatBubble
lead:
  text: A single message bubble. Sent (ink) or received (card surface). Tail marks the last bubble in a run. Kind.
  source: tokens/contracts.json description, up to the first colon or semicolon
category: Chat
rendersAs: null
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-data-chatbubble--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/ChatBubble/ChatBubble.tsx
  storyTitle: Components/Data/ChatBubble
props:
  - name: side
    figmaName: side
    type: '''sent'' | ''received'''
    values:
      - sent
      - received
    required: true
    doc: Which side the bubble sits on. Sent = right, received = left.
    at: src/components/ChatBubble/ChatBubble.tsx:76
  - name: tail
    figmaName: tail
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      Figma "Show tail": the iMessage tail at the bottom corner on the speaker's side (bottom-right sent, bottom-left received). True on the
      last bubble in a run.
    at: src/components/ChatBubble/ChatBubble.tsx:78
  - name: kind
    figmaName: kind
    type: '''text'' | ''ask'' | ''draft'' | ''big-emoji'' | ''image'''
    values:
      - text
      - ask
      - draft
      - big-emoji
      - image
    default: text
    required: false
    doc: >-
      text: normal; ask: a question waiting on the reader, headed by an attention StatusPill; draft: an unsent reply, a dashed outline on
      the surface with a quiet label (ask and draft per BellaComponents, 11 Nov 2026); big-emoji: oversized, transparent fill; image:
      constrained image slot.
    at: src/components/ChatBubble/ChatBubble.tsx:85
  - name: kindLabel
    figmaName: kindLabel
    type: string
    required: false
    doc: 'The words heading an ask or draft bubble. Defaults: "Waiting on you" (ask), "Draft" (draft).'
    at: src/components/ChatBubble/ChatBubble.tsx:87
  - name: tapback
    type: string
    required: false
    doc: Tapback emoji, rendered above the bubble corner (older; prefer reactions).
    at: src/components/ChatBubble/ChatBubble.tsx:89
  - name: reactions
    type: ReactionName[]
    required: false
    doc: 'The reactions on this message, as the coloured Reaction badge on its corner. It pops on (no sparkle burst, 22 Nov: "NO sparkles").'
    at: src/components/ChatBubble/ChatBubble.tsx:91
  - name: reactionCount
    type: number
    required: false
    doc: How many reactions in all, when more people reacted than glyphs shown.
    at: src/components/ChatBubble/ChatBubble.tsx:93
  - name: children
    figmaName: children
    type: ReactNode
    required: true
    doc: 'Children: the bubble''s content.'
    at: src/components/ChatBubble/ChatBubble.tsx:95
  - name: actions
    type: ReactNode
    required: false
    doc: Action chips rendered below the text, inside the bubble.
    at: src/components/ChatBubble/ChatBubble.tsx:97
  - name: emojiLabel
    type: string
    required: false
    doc: 'For big-emoji kind: describe the emoji for assistive tech.'
    at: src/components/ChatBubble/ChatBubble.tsx:99
  - name: disc
    type: ReactNode
    required: false
    doc: >-
      Who is speaking, pinned to the bottom-left of a received bubble (aria-hidden; senderName or the thread says it in words). One or two
      letters ("B" for BELLA) draw an initial disc that reads in every theme; an Avatar (or any node) is placed as is; any other string is a
      plain colour disc (older use).
    at: src/components/ChatBubble/ChatBubble.tsx:106
  - name: senderName
    type: string
    required: false
    doc: Speaker name label displayed above the first bubble of a received run. Uses BELLA's label size.
    at: src/components/ChatBubble/ChatBubble.tsx:108
  - name: className
    type: string
    required: false
    doc: Extra classes on the root row.
    at: src/components/ChatBubble/ChatBubble.tsx:110
variants:
  side:
    values:
      - sent
      - received
    default: null
    at: src/components/ChatBubble/ChatBubble.tsx:76
  kind:
    values:
      - text
      - ask
      - draft
      - big-emoji
      - image
    default: text
    at: src/components/ChatBubble/ChatBubble.tsx:85
states:
  contract:
    - default
  css:
    - hover
    - '[aria-pressed=''true'']'
    - focus-visible
    - '[data-reaction=''heart'']'
    - '[data-reaction=''up'']'
    - '[data-reaction=''down'']'
    - '[data-reaction=''haha'']'
    - '[data-reaction=''bang'']'
    - '[data-reaction=''question'']'
sizes: []
anatomy:
  scaleWidth: 480
  parts:
    - 'n': 1
      name: Bubble
      type: GUIDANCE
      layer: root
      at: top
      side: right
      from: guidance.anatomyParts (a component whose parts sit in one row needs them named by hand)
    - 'n': 2
      name: Message text
      type: GUIDANCE
      layer: Message
      at: centre
      side: left
      from: guidance.anatomyParts (a component whose parts sit in one row needs them named by hand)
    - 'n': 3
      name: Tail corner
      type: GUIDANCE
      layer: root
      at: bottom
      side: right
