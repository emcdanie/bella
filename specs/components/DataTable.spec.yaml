  contract: >-
    Verified 2026-10-03: a real table named by its visible caption (aria-labelledby; the caption sits above the frame, 20 Nov 2026); column
    headers scope=col, the first cell of each row scope=row. Sortable headers hold a button and carry aria-sort (none, ascending,
    descending); the arrow is decorative. Selection is a toggle button with aria-pressed in the row header; the selected row is the light
    blue fill (background/brand-subtle-hover) with a bold ink label: 12.30:1 Chip light, 9.54:1 BELLA light, 7.34:1 BELLA dark (AAA,
    measured 20 Nov 2026; Chip dark's white-alpha tint not measured), nested components included, and no other row changes. Header labels
    text-secondary on panel, 7.09:1 light / 8.44:1 dark (AAA). The frame's edge and corners sit on the scroll wrapper, so they stay while
    the table scrolls; with maxHeight that wrapper is a focusable region named by the caption. Sort and select buttons hit the 44px
    touch-target token; focus ring 4px with a 4px gap.
