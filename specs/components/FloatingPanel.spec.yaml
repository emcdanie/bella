name: FloatingPanel
lead:
  text: >-
    A panel detached from its drawer into a small window that floats over any page, so you can watch an agent (the Terminal) and keep
    working. A title bar with a grip, the title, an optional status (a StatusDot, no wash) and a Stop button, Dock and Close.
  source: tokens/contracts.json description, up to the first colon or semicolon
category: Layout
rendersAs: null
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-layout-floatingpanel--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/FloatingPanel/FloatingPanel.tsx
  storyTitle: Components/Layout/FloatingPanel
props:
  - name: title
    figmaName: Title
    type: string
    default: Terminal
    required: false
    doc: Figma "Title". What the panel is ("Terminal"); names the dialog and the Dock and Close buttons.
    at: src/components/FloatingPanel/FloatingPanel.tsx:11
  - name: status
    figmaName: Show status
    type: string
    required: false
    doc: Figma "Show status" + the StatusDot word ("Working"). Missing = off.
    at: src/components/FloatingPanel/FloatingPanel.tsx:13
  - name: statusTone
    type: StatusDotProps['tone']
    values:
      - success
      - info
      - attention
      - danger
      - neutral
    default: info
    required: false
    doc: The StatusDot tone beside the title. Default info, a dot with no wash.
    at: src/components/FloatingPanel/FloatingPanel.tsx:15
  - name: actionLabel
    figmaName: Show action
    type: string
    required: false
    doc: 'Figma "Show action" + its label ("Stop"): a secondary Button in the title bar. Missing = off.'
    at: src/components/FloatingPanel/FloatingPanel.tsx:17
  - name: onAction
    type: () => void
    required: false
    at: src/components/FloatingPanel/FloatingPanel.tsx:18
  - name: children
    figmaName: Body
    type: ReactNode
    required: false
    doc: 'Figma "Body" slot: the drawer''s content as it is (the Terminal steps and composer).'
    at: src/components/FloatingPanel/FloatingPanel.tsx:20
  - name: onDock
    type: () => void
    required: false
    doc: 'Dock puts it back in the drawer: the Dock button or Esc. Focus goes back to the button that opened it.'
    at: src/components/FloatingPanel/FloatingPanel.tsx:22
  - name: onClose
    type: () => void
    required: false
    doc: Close closes it (a running job keeps running; Stop stops it). Focus goes back to the opener.
    at: src/components/FloatingPanel/FloatingPanel.tsx:24
  - name: defaultPosition
    type: '{ x: number; y: number }'
    required: false
    doc: Where it opens, in viewport pixels from the top left. Missing = the bottom right corner, 16 in from both edges.
    at: src/components/FloatingPanel/FloatingPanel.tsx:26
  - name: onMove
    type: '(position: { x: number; y: number }) => void'
    required: false
    doc: Fires once a move ends (a drag drop or an arrow press).
    at: src/components/FloatingPanel/FloatingPanel.tsx:28
  - name: className
    type: string
    required: false
    doc: Extra classes on the window.
    at: src/components/FloatingPanel/FloatingPanel.tsx:30
  - name: style
    type: CSSProperties
    required: false
    at: src/components/FloatingPanel/FloatingPanel.tsx:31
