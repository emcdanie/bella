guidance:
  lead: One message in a thread. Sent sits right in ink; received sits left on the inset wash.
  whenToUse:
    - task: One message in a lane thread
      answer: ✓ Use ChatBubble
      visual: ChatBubble
      visualVariant: side=sent, kind=text, tail=false
      kind: This one
    - task: A question waiting on the reader
      answer: ✓ Use ChatBubble ask
      visual: ChatBubble
      visualVariant: side=received, kind=ask, tail=false
      kind: This one
    - task: The whole list of messages
      answer: → Use ChatThread
      visual: ChatThread
      kind: Instead
    - task: Someone is typing a reply
      answer: → Use TypingDots
      visual: TypingDots
      kind: Instead
  doDont:
    - do:
        rule: Ask kind for a question waiting on the reader
        vp:
          side: received
          kind: ask
          tail: 'false'
        props:
          children: Gate is green. Merge it?
      dont:
        rule: A plain bubble that hides the question
        vp:
          side: received
          kind: text
          tail: 'false'
        props:
          children: Gate is green. Merge it?
  anatomyParts:
    - name: Bubble
      layer: root
      at: top
      side: right
    - name: Message text
      layer: Message
      at: centre
      side: left
    - name: Tail corner
      layer: root
      at: bottom
      side: right
  inContext:
    intro: A question and its draft reply, as they sit in a lane thread.
    stack:
      - vp:
          side: received
          kind: ask
          tail: 'false'
        props:
          children: Gate is green. Merge it?
      - vp:
          side: sent
          kind: draft
          tail: 'false'
        props:
          children: Yes, merge it.
  doDontIntro: A question gets the ask kind, so it reads as waiting on you.
  contrastSample: Gate is green.
  contrastExtra:
    - label: Sent label on ink
      foreground: '--component-chat-bubble-sent-foreground'
      background: '--component-chat-bubble-sent-background'
      bar: AA
    - label: Received label on its wash
      foreground: '--component-chat-bubble-received-foreground'
      background: '--component-chat-bubble-received-background'
      bar: AA
    - label: Draft dashed outline on the page
      foreground: '--color-semantic-border-strong'
      background: '--color-semantic-background'
      bar: NON_TEXT
  a11yBracket: 50
  a11yRule: Not interactive. Plain text, read in order; a big emoji takes its label.
  a11yChips:
    - kind: Role
      value: none (text); img for a big emoji
    - kind: Name
      value: The message text, or emojiLabel
    - kind: Focus order
      value: Not in tab order
  motionRows: []
  propNotes:
    side: Sent sits right, received left
    tail: Rounds the tail corner; last bubble of a run
    kind: text, ask, draft, big-emoji or image
    kindLabel: Heading words for ask or draft
    tapback: Emoji above the corner
    children: The message
    actions: Chips below the text, inside the bubble
    emojiLabel: Describes a big emoji
    disc: Speaker colour disc on a received bubble
    senderName: Name above a received run
    className: Extra classes on the row
  anatomyScaleWidth: 480
  codeTitle: Ask and draft
  codeExample:
    file: ~/DEV/bella-storybook-brand/src/components/ChatBubble/ChatBubble.stories.tsx
    lines: 123-126
