      reviewed:
        - date: "2026-07-21"
          by: human:elleta
          note: on ground 5.66:1, on paper 5.96:1, on surface 5.25:1, AA text + AAA large + 3:1 non-text on all light surfaces; AAA normal-text fails everywhere (max 5.96:1). On navy 2.64:1, fails all thresholds, including non-text.
      tags:
        - primitive
        - color
      group: color.brand
    sections:
      - kind: guidelines
        for: all
        framing: when-to-use
        title: Where it is used
        items:
          - level: may
            statement: Primary button fill (ground/white label)
          - level: may
            statement: Secondary button outline + text
          - level: may
            statement: Inline link color paired with underline
          - level: may
            statement: Accent word in display headings
          - level: may
            statement: Focus rings
      - kind: guidelines
        for: all
        title: How to use it
        items:
          - level: must-not
            statement: Never on navy — 2.64:1 fails text AND the 3:1 non-text minimum; dark mode uses periwinkle
          - level: must-not
            statement: Never on eyebrows — wayfinding is not action
          - level: must-not
            statement: Never pair with a second accent color
    related:
      - to: color.brand.periwinkle
        rel: relates-to
        note: dark-mode counterpart
    tokenType: color
    source:
      href: ./tokens/bella.json
      rel: file
      role: primitive.color.brand.iris
