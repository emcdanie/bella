      category: '123:0'
    - label: >-
        One tab stop: an interactive card is ONE anchor or button; never nest interactives. Focus ring 3px color/semantic/focus-ring (pink
        in Chip, #CF5A95), 3px offset, focus-visible only.
      category: '123:2'
