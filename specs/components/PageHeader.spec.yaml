notApplicable:
  - section: Behaviour and motion
    why: no transition or animation in src/components/PageHeader/PageHeader.module.css
guidance:
  lead: 'The top of every page: meta, one title, a lede and the page actions.'
  whenToUse:
    - task: Starting a page
      answer: ✓ Use PageHeader
      visual: PageHeader
      visualTexts:
        Lede: One or two sentences.
      kind: This one
    - task: Starting a section on a page
      answer: → Use SectionHeader
      kind: Instead
    - task: A heading inside content
      answer: → Use Heading
      visual: Heading
      kind: Instead
    - task: A small label above a heading
      answer: → Use Eyebrow
      visual: Eyebrow
      kind: Instead
  doDont: []
  anatomyParts:
    - name: Icon well
      at: left
      side: left
    - name: Title
      at: centre
      side: left
    - name: Actions
      at: right
      side: right
  inContext: []
  a11yBracket: 44
  a11yRule: One h1 per page, and it names the page. Actions are ordinary Buttons, so they are the tab stops.
  a11yChips:
    - kind: Role
      value: heading, level 1
    - kind: Name
      value: the title text
    - kind: Focus order
      value: Actions only
      num: '1'
  motionRows: []
  propNotes:
    meta: Quiet line above the title
    title: The page's one h1
    lede: One or two sentences, 70ch at most
    icon: Decorative well before the title
    titleAside: Beside the title, outside the h1
    actions: At most one primary Button
    id: The h1's id
  anatomyScaleWidth: 700
  contrastVarMap:
    '--component-page-header-foreground': color/semantic/text-primary
    '--component-page-header-meta-foreground': color/semantic/text-secondary
  fillSpecimens: true
  anatomyProps:
    Show meta: false
    Show lede: false
  whenColumns: 1
  a11ySpecimenWidth: 640
  baseProps:
    meta: Specimen No. 002 · Actions
    title: Button
    lede: One or two sentences under the title.
  codeExample:
    file: ~/DEV/bella-chip-theme/src/components/PageHeader/PageHeader.stories.tsx
    lines: 35-47
    import: import PageHeader from '@bella/components/PageHeader/PageHeader';
    code: |-
      <PageHeader
        meta="Specimen No. 002 · Actions"
        title="Button"
        lede="Buttons with real hierarchy: two colour treatments, three tiers, one primary per view."
        actions={
          <>
            <ActionChip onClick={() => {}}>Copy import</ActionChip>
            <Button variant="primary" onClick={() => {}}>Open the story</Button>
          </>
        }
      />
