props:
  - name: direction
    type: '''horizontal'' | ''vertical'' | ''turn'' | ''curve'''
    values:
      - horizontal
      - vertical
      - turn
      - curve
    default: horizontal
    required: false
    doc: Figma "direction". horizontal and vertical stretch to their box; turn is a 24 box with a 16-radius quarter curve.
    at: src/components/MapLine/MapLine.tsx:9
  - name: end
    type: '''arrow'' | ''none'''
    values:
      - arrow
      - none
    default: arrow
    required: false
    doc: Figma "end". Arrow on the last piece only (straight pieces; Figma draws turns with none).
    at: src/components/MapLine/MapLine.tsx:11
  - name: variant
    type: '''solid'' | ''dashed'''
    values:
      - solid
      - dashed
    default: solid
    required: false
    doc: Figma "style" (code cannot use `style`, the CSS prop; same move as Tag's variant). dashed = an optional path, or a step not yet done.
    at: src/components/MapLine/MapLine.tsx:14
  - name: tone
    type: '''default'' | ''selected'' | ''accent'' | ''danger'''
    values:
      - default
      - selected
      - accent
      - danger
    default: default
    required: false
    doc: >-
      Figma "tone". default = border/strong; selected = brand blue (the selected step's lines, curve); accent = pink, annotations only (the
      open node); danger = a failing link.
    at: src/components/MapLine/MapLine.tsx:16
  - name: from
    type: '{ x: number; y: number }'
    required: false
    doc: >-
      curve only: where the line starts, in the pixels of its positioned parent (the middle of a step's bottom edge). With `to`, the line
      positions and sizes itself to run between the two points, flipping when `to` is left of `from`, so it follows measured nodes when the
      board moves or zooms.
    at: src/components/MapLine/MapLine.tsx:18
  - name: to
    type: '{ x: number; y: number }'
    required: false
    doc: 'curve only: where the line ends (the middle of the next step''s top edge).'
    at: src/components/MapLine/MapLine.tsx:20
  - name: flip
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'curve only, without `from` and `to`: flip the line horizontally so it runs top right to bottom left in its own box.'
    at: src/components/MapLine/MapLine.tsx:22
  - name: corner
    type: MapLineCorner
    default: none
    required: false
    doc: 'Figma "corner". Turn only: which corner the curve bends round.'
    at: src/components/MapLine/MapLine.tsx:24
  - name: weight
    type: '''regular'' | ''thin'''
    values:
      - regular
      - thin
    default: regular
    required: false
    doc: >-
      curve only. Weight: regular is 2px; thin is 1px in a lighter tone, for the lines of steps that are not picked so a busy map does not
      bunch.
    at: src/components/MapLine/MapLine.tsx:26
  - name: draw
    type: '''none'' | ''map'' | ''pick'''
    values:
      - none
      - map
      - pick
    default: none
    required: false
    doc: >-
      curve only. Draw-in along the line, start to end, when it appears or this prop changes: map = 900ms (the first draw of a map), pick =
      250ms (a line becoming the picked step's). none = drawn at once.
    at: src/components/MapLine/MapLine.tsx:28
  - name: travel
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      curve only. A soft highlight travels the line in its direction, once, then rests. Set it on the picked step's lines; it plays each
      time it turns on.
    at: src/components/MapLine/MapLine.tsx:30
