guidance:
  lead: The message column of one lane. It holds the conversation, owns the scroll and announces new messages.
  whenToUse:
    - task: One lane's conversation
      answer: ✓ Use ChatThread
      visual: ChatThread
      kind: This one
    - task: A single message
      answer: → Use ChatBubble
      visual: ChatBubble
      visualVariant: side=sent, kind=text, tail=false
      kind: Instead
    - task: A log or a list of work
      answer: → Use ListRow
      visual: ListRow
      kind: Instead
    - task: Someone is typing
      answer: → Use TypingDots
      visual: TypingDots
      kind: Instead
  doDont: []
  anatomyParts:
    - name: Received message
      layer: Received group
      at: centre
      side: left
    - name: Timestamp
      layer: ChatThreadTimestamp
      at: centre
      side: right
    - name: Sent message
      layer: Sent group
      at: centre
      side: right
    - name: Delivered line
      layer: ChatThreadDelivered
      at: centre
      side: right
  inContext: []
  contrastSample: Aa
  contrastExtra:
    - label: Timestamp and Delivered on a card
      foreground: '--color-semantic-text-secondary'
      background: '--color-semantic-surface-card'
      bar: AA
    - label: Focus ring on the page
      foreground: '--color-semantic-focus-ring'
      background: '--color-semantic-background'
      bar: NON_TEXT
  a11yBracket: null
  a11yTag: WxH
