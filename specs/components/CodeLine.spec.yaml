description: >-
  Purpose One line of a CodeBlock.



  Use inside CodeBlock's Lines slot only.



  Don't use inline code.



  States None: static. kind plain, current (code-block current wash), add, del (diff washes).



  Parts Number · Code (runs coloured per token, like Prism).



  Code import { CodeBlock } from 'bella'. Props: Part of CodeBlock: Code → one line of code · kind=current → currentLine · Show number →
  lineNumbers. Tokens: --component-code-block-add, --component-code-block-attr, --component-code-block-background,
  --component-code-block-border, --component-code-block-border-radius, --component-code-block-comment and 11 more component tokens. A11y:
  Renders: button, pre/code region. Verified 2026-11-07: the code is a focusable region named by its title; line numbers are aria-hidden;
  Copy is a 44px icon button named "Copy <title>" with a tooltip, and Copied is announced.



  Links GitHub · Storybook



  Wrap (15 Nov) wrap=off (default) keeps one line: the Code text hugs. wrap=on makes the Code text, or the Markup row, fill the line width
  and wrap; continuation rows align with the code, not under the number. It is a variant, not a boolean, because Figma booleans cannot
  change layout sizing.
