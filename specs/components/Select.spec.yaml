guidance:
  lead: A styled native select for long lists. The platform draws the popup and owns the keys.
  whenToUse:
    - task: Sorting or choosing from a long list
      answer: ✓ Use Select
      visual: Select
      visualVariant: state=default
      kind: This one
    - task: Two to five visible options
      answer: → Use SegmentedControl
      visual: SegmentedControl
      kind: Instead
    - task: Filtering a list
      answer: → Use FilterChip
      visual: FilterChip
      kind: Instead
    - task: Searching the options
      answer: → Use Combobox
      visual: Combobox
      visualTexts:
        Value: Search options
      kind: Instead
  doDont:
    - do:
        rule: A segmented control for three options
        set: SegmentedControl
      dont:
        rule: A select for three options
        vp:
          state: default
        props:
          label: Repeat
          value: Weekly
