codeExample:
  file: ~/DEV/bella-storybook-brand/src/components/Stat/Stat.stories.tsx
  lines: 54-54
  import: import Stat from '@bella/components/Stat/Stat';
  importSource: the style the Button doc page uses (CHIP import path)
  code: <Stat label="Components" value={18} delta="2 since last sync" trend="up" />
usage:
  use:
    - CHIP health figures (components, failures, indexed chunks, last sync)
    - Any small row of headline figures on a Card or panel
  dont:
    - 'Do not colour the change: up is not always good, and the status ladder has no neutral change colour'
    - 'Do not invent figures: a Stat shows a real count or nothing'
    - 'Do not give it its own box: place Stats on a Card or panel'
    - Do not draw a sparkline from fewer than two real points, and never from made-up history
    - 'Do not colour the sparkline: its shape carries the trend'
  source: tokens/component.json
