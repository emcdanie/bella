    required: false
    doc: Called once the card has left. Remove it then.
    at: src/components/TaskCard/TaskCard.tsx:74
  - name: className
    type: string
    required: false
    at: src/components/TaskCard/TaskCard.tsx:75
  - name: style
    type: CSSProperties
    required: false
    at: src/components/TaskCard/TaskCard.tsx:76
