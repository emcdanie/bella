usage:
  use:
    - 'shape="dot": the state''s mark only, the word kept as the accessible name (CHIP Today, Elleta 7 Nov 2026)'
    - Current-focus marker
    - Project state rows
    - Availability notes
    - 'neutral: a state that is neither good nor bad (not tested, draft, disabled), no tint (CHIP, 2026-10-03)'
    - >-
      Per variant, background, foreground and border are tokens, so a theme can restyle every state without touching the component (chip:
      soft washes, same-hue labels, no border; 7 Nov 2026)
  dont:
    - 'Do not make it clickable: a pill that toggles is a FilterChip'
    - >-
      Do not colour the label with the state tint in BELLA's own themes. A theme may set a same-hue dark label only where it holds AAA on
      its wash, as chip does
    - >-
      Do not design new status UI on the carried tints without asking: the BELLA-native status ladder (issue #1) is pending and will restyle
      this
