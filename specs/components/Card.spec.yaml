guidance:
  lead: The one card surface. Group one idea, with an optional cover, on a raised panel.
  whenToUse:
    - task: Showing one item or idea as a tile
      answer: ✓ Use Card
      visual: Card
      visualVariant: variant=default, state=resting
      kind: This one
    - task: A card with cover, title and a link to a project
      answer: → Use ResourceCard
      visual: ResourceCard
      kind: Instead
    - task: One number or score
      answer: → Use Stat
      visual: Stat
      kind: Instead
    - task: A row in a work list
      answer: → Use ListRow
      visual: ListRow
      kind: Instead
  doDont:
    - do:
        rule: One card for one idea
        vp:
          variant: default
      dont:
        rule: A card inside a card
        vp:
          variant: default
        nestCard: true
  anatomyParts:
    - name: Surface
      at: top
      side: left
    - name: Cover, optional
      layer: Media
      side: right
    - name: Title
      layer: Title
      at: left
    - name: Text
      at: left
  inContext: []
  doDontIntro: One idea per card. A card never holds another card.
  pictureOnStone: true
  whenColumns: 2
  codeTitle: Whole card as a link
  codeExample:
    lines: 152-154
    code: |-
      <Card href="#card-link">
        <h3>Card title</h3>
        <p>One short supporting line.</p>
      </Card>
  contrastVarMap: {}
  contrastSkip: []
  contrastExtra:
    - label: Focus ring
      foreground: '--color-semantic-focus-ring'
      background: '--color-semantic-surface-card'
      bar: NON_TEXT
  a11yRule: 'A static card is not focusable. An interactive card is one link or button: one tab stop, no nested interactives.'
  a11yChips:
    - kind: Role
      value: link or button (interactive only)
    - kind: Name
      value: Visible content, or ariaLabel
    - kind: Focus order
      value: Tab stop
      num: '1'
  motionRows:
    - title: Hover
      set: Card
      before:
        variant: variant=default, state=resting
        caption: Rest
      after:
        variant: variant=default, state=hover
        caption: Hovered
      plain: Interactive cards lift 2px and gain the hover shadow in the lift duration. Static cards never move.
  propNotes:
    variant: peek is a fixed light card, on purpose
    media: Cover in a fixed 16:10 well, never cropped
    href: Whole card is one link
    onClick: Whole card is one button
    ariaLabel: Name when visible content is not the right name
    linkComponent: Your router's Link
    children: Title, text and anything else in the body
  anatomyScaleWidth: 480
  anatomyProps:
    Media: true
  a11yTag: WxH
  focusRingRadius: 16 radius
  stateTags:
    hover: Lifts 2px
    focus: Shadow deepens
  reducedMotionLine: 'Reduced motion: no lift, and the shadow swaps at once.'
  propSpecimens:
    variant:
      - vp:
          variant: default
      - vp:
          variant: peek
        onDark: true
  baseProps:
    Title: Card title
    Text: One short supporting line.
    Media: false
  overview:
    - use: Default
      vp:
        variant: default
        state: resting
      line: A raised panel for one idea.
  glance:
    - Static or one link or button
    - Peek is fixed light
  overviewIntro: One card surface; the content goes inside.
