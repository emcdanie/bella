name: Card
lead:
  text: The one-card system.
  source: tokens/component.json description, up to the first colon or semicolon
category: Layout
rendersAs: a div; with href one anchor, with onClick one button
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-card--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/Card/Card.tsx
  storyTitle: Components/Card
props:
  - name: accent
    type: string
    required: false
    doc: >-
      @deprecated No visual effect since the flat surface rules (2026-09-19): cards carry no accent border, trace, or halo. Accepted so
      existing callers keep compiling; slated for removal in the next major.
    at: src/components/Card/Card.tsx:10
  - name: variant
    type: '''default'' | ''peek'''
    values:
      - default
      - peek
    default: default
    required: false
    doc: >-
      Surface behavior. `"default"` is theme-aware: the inner panel renders the card surface (surface-card: the page ground one step darker,
      in both themes) and inks follow the semantic cascade, so a light page structurally cannot show a dark card. `"peek"` is the one
      recorded exception: a fixed always-light paper panel meant to float light on the dark ground; its inks are re-scoped so dark mode
      cannot render light-on-light. There is no fixed-dark variant.
    at: src/components/Card/Card.tsx:20
  - name: media
    type: ReactNode
    required: false
    doc: >-
      Full-bleed cover media above the padded body, in a fixed 16:10 well that never crops: images sit at contain on the card surface. Shown
      as is: no gradient or scrim over the image, so never set text on the cover. Supply images at least 2x the rendered width. Marked
      `aria-hidden` when an `ariaLabel` names the card.
    at: src/components/Card/Card.tsx:28
  - name: mediaScrim
    type: boolean
    values:
      - true
      - false
    required: false
    doc: '@deprecated No effect since the flat surface rules (2026-09-19): media never carries a scrim. Slated for removal in the next major.'
    at: src/components/Card/Card.tsx:33
  - name: href
    type: string
    required: false
    doc: >-
      Whole card is ONE link, no nested links. External (http…) hrefs open in a new tab. Interactive cards (href or onClick) are the only
      cards that lift on hover and focus.
    at: src/components/Card/Card.tsx:39
  - name: onClick
    type: () => void
    required: false
    doc: Whole card is ONE button (e.g. opens a modal). Ignored when `href` is set.
    at: src/components/Card/Card.tsx:41
  - name: ariaLabel
    type: string
    required: false
    doc: Accessible name for interactive cards whose visible content isn't the right name.
    at: src/components/Card/Card.tsx:43
  - name: linkComponent
    type: ElementType
    default: a
    required: false
    doc: Component used to render internal links; inject your router's Link (e.g. next/link) at the consumer; defaults to a plain anchor.
    at: src/components/Card/Card.tsx:48
  - name: className
    type: string
    required: false
    doc: Extra classes on the outer wrapper.
    at: src/components/Card/Card.tsx:50
  - name: innerClassName
    type: string
    required: false
    doc: Extra classes on the inner panel (e.g. custom padding/layout).
    at: src/components/Card/Card.tsx:52
  - name: style
    type: CSSProperties
    required: false
    at: src/components/Card/Card.tsx:53
  - name: children
    type: ReactNode
    required: false
    at: src/components/Card/Card.tsx:54
