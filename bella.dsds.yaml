  - kind: entry
    id: foundation-color
    name: Colour
    description: Neutral light and dark steps, one accent (ochre, a fill), three chip fills, and a brand pattern. Colour lives in fills, never in strokes or body text, except focus and status (danger, success).
    metadata:
      origin:
        method: extracted
        author: machine-assisted
      tags:
        - foundation
        - color
    sections:
      - kind: guidelines
        for: all
        title: The palette is decided
        items:
          - level: must
            statement: "Dark elevation MUST climb lighter on neutral greys: page `color.dark.bg`, then `color.dark.surface`, `color.dark.inset`, `color.dark.raised`."
            checkedBy: manual
          - level: may
            statement: White alpha is permitted as a translucent glass overlay only; the warmth comes from the ground showing through.
            checkedBy: manual
          - level: should-not
            statement: Supporting `steel` and `sage` are carried from the April identity for status states in non-text roles only. Do not design new status UI around them without asking.
            checkedBy: manual
          - level: must-not
            statement: "Pure white is the light page ground (`color.light.bg`) and nothing else: panels, cards and chips step down from it."
            checkedBy: assisted
          - level: must-not
            statement: "Ochre (`color.brand.ochre`) is the one accent: a fill, always with ink text (9.01:1), never text or a hairline on light (2.08:1). Iris and periwinkle are retired (2026-09-22)."
            checkedBy: assisted
      - kind: guidelines
        for: all
        title: Accessibility
        description: The AAA-minded AA bar, recorded 2026-07-21.
        items:
          - level: must
            checkedBy: assisted
            tags:
              - accessibility
            refs:
              - to: bella-a11y#aaa-for-ink-and-body-text
                rel: same-as
          - level: must
            checkedBy: assisted
            tags:
              - accessibility
            refs:
              - to: bella-a11y#worst-ground-wins
                rel: same-as
          - level: must-not
            checkedBy: assisted
            tags:
              - accessibility
            refs:
              - to: bella-a11y#the-accent-always-theme-flips
                rel: same-as
    refs:
      - to: color.brand.ochre
        rel: composes
