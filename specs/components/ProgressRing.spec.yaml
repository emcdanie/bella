props:
  - name: state
    type: ProgressRingState
    default: running
    required: false
    doc: >-
      Figma "state". running = a turning blue arc; done = a filled green circle with a tick; waiting = a grey ring (also paused); failed = a
      filled red circle with a cross.
    at: src/components/ProgressRing/ProgressRing.tsx:12
  - name: size
    type: '''sm'' | ''md'''
    values:
      - sm
      - md
    default: sm
    required: false
    doc: Figma "size". sm 20 (a check item, a card's step row); md 36 (a header count, Step's marker).
    at: src/components/ProgressRing/ProgressRing.tsx:14
  - name: value
    type: number
    required: false
    doc: >-
      running, determinate: steps done. With `total` the arc is value / total and md shows "n/m". Missing = indeterminate (a half arc
      turning).
    at: src/components/ProgressRing/ProgressRing.tsx:16
  - name: total
    type: number
    required: false
    doc: 'running, determinate: steps in all.'
    at: src/components/ProgressRing/ProgressRing.tsx:18
  - name: showCount
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: Figma "Show count" (md, running, determinate). Off hides "n/m"; the accessible name still says it.
    at: src/components/ProgressRing/ProgressRing.tsx:20
  - name: duration
    type: number
    default: '2.5'
    required: false
    doc: >-
      Indeterminate only: seconds the arc may turn (default 2.5, under the 3 s rule). After that it settles to a still half arc and says
      "still working".
    at: src/components/ProgressRing/ProgressRing.tsx:22
  - name: label
    type: string
    required: false
    doc: What the ring is for, put first in its accessible name ("Code, running, 2 of 5").
    at: src/components/ProgressRing/ProgressRing.tsx:24
  - name: decorative
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'The words beside it already say the state: hide the ring from screen readers.'
    at: src/components/ProgressRing/ProgressRing.tsx:26
  - name: className
    type: string
    required: false
    doc: Extra classes on the root.
    at: src/components/ProgressRing/ProgressRing.tsx:28
  - name: style
    type: CSSProperties
    required: false
    at: src/components/ProgressRing/ProgressRing.tsx:29
