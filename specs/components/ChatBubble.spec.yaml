name: ChatBubble
lead:
  text: A single message bubble. Sent (ink) or received (card surface). Tail marks the last bubble in a run. Kind.
  source: tokens/component.json description, up to the first colon or semicolon
category: Chat
rendersAs: null
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-chat-chatbubble--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/ChatBubble/ChatBubble.tsx
  storyTitle: Components/Chat/ChatBubble
props:
  - name: side
    type: '''sent'' | ''received'''
    values:
      - sent
      - received
    required: true
    doc: Which side the bubble sits on. Sent = right, received = left.
    at: src/components/ChatBubble/ChatBubble.tsx:7
  - name: tail
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: Round the tail corner (bottom-right for sent, bottom-left for received). True on the last bubble in a run.
    at: src/components/ChatBubble/ChatBubble.tsx:9
  - name: kind
    type: '''text'' | ''ask'' | ''draft'' | ''big-emoji'' | ''image'''
    values:
      - text
      - ask
      - draft
      - big-emoji
      - image
    default: text
    required: false
    doc: >-
      text: normal; ask: a question waiting on the reader, headed by an attention StatusPill; draft: an unsent reply, a dashed outline on
      the surface with a quiet label (ask and draft per BellaComponents, 11 Nov 2026); big-emoji: oversized, transparent fill; image:
      constrained image slot.
    at: src/components/ChatBubble/ChatBubble.tsx:16
  - name: kindLabel
    type: string
    required: false
    doc: 'The words heading an ask or draft bubble. Defaults: "Waiting on you" (ask), "Draft" (draft).'
    at: src/components/ChatBubble/ChatBubble.tsx:18
  - name: tapback
    type: string
    required: false
    doc: Tapback emoji, rendered above the bubble corner.
    at: src/components/ChatBubble/ChatBubble.tsx:20
  - name: children
    type: ReactNode
    required: true
    doc: 'Children: the bubble''s content.'
    at: src/components/ChatBubble/ChatBubble.tsx:22
  - name: actions
    type: ReactNode
    required: false
    doc: Action chips rendered below the text, inside the bubble.
    at: src/components/ChatBubble/ChatBubble.tsx:24
  - name: emojiLabel
    type: string
    required: false
    doc: 'For big-emoji kind: describe the emoji for assistive tech.'
    at: src/components/ChatBubble/ChatBubble.tsx:26
  - name: disc
    type: string
    required: false
    doc: Colour disc (24px) pinned to the bottom-left of a received bubble. Aria-hidden. Shows speaker identity in a multi-lane thread.
    at: src/components/ChatBubble/ChatBubble.tsx:28
  - name: senderName
    type: string
    required: false
    doc: Speaker name label displayed above the first bubble of a received run. Uses BELLA's label size.
    at: src/components/ChatBubble/ChatBubble.tsx:30
  - name: className
    type: string
    required: false
    doc: Extra classes on the root row.
    at: src/components/ChatBubble/ChatBubble.tsx:32
variants:
