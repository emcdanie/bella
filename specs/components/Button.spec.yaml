  annotations:
    - label: >-
        States: default, hover, pressed, focus; disabled=true on every tier. Primary only for the action that commits something (Push,
        Accept, Publish, a dialog confirm), one per card or dialog; in a group the primary sits last, the group right-aligned. Polaris look
        for Chip: decision pending (Elleta).
      category: '123:1'
    - label: >-
        Hover and focus-visible: the label rolls up and an aria-hidden copy rolls in over motion/duration/normal on motion/easing/out; the
        fill and edge shift over motion/duration/fast on motion/easing/standard. Never lifts. Pressed: primary presses down 2px; secondary
        and tertiary settle on their pressed fill. Disabled does not roll or press.

        Reduced motion: no roll, no press; the colour change is instant.
      category: '123:4'
    - label: >-
        <Button variant size iconOnly href onClick type disabled ariaLabel ariaExpanded ariaHaspopup> · src/components/Button/Button.tsx.
        Defaults: variant secondary, type button. 44 tall at every size (spacing/44); size="sm" keeps the 44 box; iconOnly is a 44 circle.
        Corners: pill in BELLA, 8 corner in Chip (border/radius/lg). Sides 20 (spacing/20), gap 8 (spacing/8), label typography/font-size/16
        at typography/font-weight/600. Chip light: primary fill color/background/brand with the navy label color/content/brand-knockout;
        secondary tint button/color/background/default with edge color/border/brand; tertiary text color/content/brand.
      category: '123:0'
    - label: >-
        Role and name: a native <button> (type button), or one <a> when href is set. The name is the visible label (the rolling copy is
        aria-hidden); icon-only buttons need ariaLabel.

        Keyboard: Tab to reach; Enter or Space on a button, Enter on a link.

        Focus: focus-visible only. Ring color/border/focus (blue/600 in Chip light), focus-ring/width 4px wide with a 4px gap
        (focus-ring/offset), outside; the pill in BELLA, 8 corner in Chip ring stays a pill in BELLA, 8 corner in Chip.

        Disabled: native disabled, buttons only: color/content/subtle on color/background/subtle, no roll, no press. Text holds 7:1.

        Target: 44 × 44 at every size.
      category: '123:2'
  documentationLinks:
    - https://emcdanie.github.io/bella/?path=/docs/components-button--docs
