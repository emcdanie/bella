  contract: >-
    A group named by its title, described by the summary line (always present). Each slot is a focusable image with roving tabindex, named
    "14:15-14:30, 3 runs, 3 failed, contracts"; arrow keys, Home and End move between slots and the callout follows, Esc closes it. The
    callout is decoration: the slot's name says the same. Pass and fail differ by position, the cross mark and the legend words, never
    colour alone. A Show table button swaps the chart for a DataTable of the same data. Bars 3:1 on the card in all four themes, text 7:1,
    numbers tabular. Reduced motion: bars stand at full height at once.
