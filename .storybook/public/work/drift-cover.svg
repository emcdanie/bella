<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-hidden="true">
  <!-- From Drift work-card cover: a steel crop of the beat-01 audit
       specimen. Abstract "everything drifted" surface, near-identical
       component pills with intentional offsets/radii + audit markers.
       Steel (the recreated client's foreign palette), NOT Elleta's iris,
       and mid/deep toned so it reads on both the light and dark card
       ground without ever flaring white. No client data, generic. -->
  <defs>
    <linearGradient id="steelBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22405C"/>
      <stop offset="0.55" stop-color="#2A527A"/>
      <stop offset="1" stop-color="#2F5C86"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A85B0"/>
      <stop offset="1" stop-color="#3E6C99"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AFC9E8" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#AFC9E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#steelBg)"/>

  <!-- baseline grid the components should have aligned to -->
  <g stroke="#AFC9E8" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="3 7">
    <line x1="40" y1="150" x2="760" y2="150"/>
    <line x1="40" y1="270" x2="760" y2="270"/>
    <line x1="40" y1="390" x2="760" y2="390"/>
  </g>

  <!-- diagonal audit sheen -->
  <rect width="800" height="500" fill="url(#sheen)"/>

  <!-- near-identical component pills, drifting off the baseline: varied
       widths, radii and vertical offsets = the same part solved many ways -->
  <g>
    <!-- row A -->
    <rect x="64"  y="118" width="124" height="42" rx="12" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="228" y="124" width="104" height="42" rx="20" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="372" y="114" width="140" height="42" rx="8"  fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="558" y="121" width="96"  height="42" rx="16" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <!-- row B -->
    <rect x="80"  y="242" width="112" height="42" rx="10" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="236" y="250" width="132" height="42" rx="21" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="412" y="238" width="100" height="42" rx="7"  fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="586" y="247" width="120" height="42" rx="14" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <!-- row C -->
    <rect x="64"  y="362" width="144" height="42" rx="18" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="252" y="358" width="96"  height="42" rx="9"  fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="392" y="367" width="124" height="42" rx="22" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
    <rect x="556" y="360" width="132" height="42" rx="12" fill="url(#pill)" stroke="#7FA3C6" stroke-opacity="0.5"/>
  </g>

  <!-- top gloss on each pill (upper-left light source) -->
  <g fill="#C9DCEE" fill-opacity="0.22">
    <rect x="72"  y="124" width="70" height="8" rx="4"/>
    <rect x="236" y="130" width="56" height="8" rx="4"/>
    <rect x="380" y="120" width="82" height="8" rx="4"/>
    <rect x="88"  y="248" width="60" height="8" rx="4"/>
    <rect x="244" y="256" width="76" height="8" rx="4"/>
    <rect x="72"  y="368" width="86" height="8" rx="4"/>
    <rect x="400" y="373" width="70" height="8" rx="4"/>
  </g>

  <!-- audit markers: light-steel rings flag the drifted parts, with a
       leader dot back to the baseline they missed -->
  <g fill="none" stroke="#AFC9E8" stroke-width="2">
    <circle cx="280" cy="145" r="17" stroke-opacity="0.85"/>
    <circle cx="462" cy="259" r="17" stroke-opacity="0.85"/>
    <circle cx="300" cy="379" r="17" stroke-opacity="0.85"/>
  </g>
  <g fill="#C9DCEE">
    <circle cx="280" cy="150" r="2.5"/>
    <circle cx="462" cy="270" r="2.5"/>
    <circle cx="300" cy="390" r="2.5"/>
  </g>
</svg>
