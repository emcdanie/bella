  github: https://github.com/emcdanie/bella/blob/main/src/components/TaskCard/TaskCard.tsx
  storyTitle: Components/Data/TaskCard
props:
  - name: title
    figmaName: Title
    type: ReactNode
    required: true
    doc: Figma "Title". What the task is. Names the card and its open link.
    at: src/components/TaskCard/TaskCard.tsx:19
  - name: line
    figmaName: Line
    type: ReactNode
    required: false
    doc: Figma "Line". One line under the title, in the subtext face.
    at: src/components/TaskCard/TaskCard.tsx:21
  - name: branch
    figmaName: Show branch
    type: ReactNode
    required: false
    doc: 'Figma "Show branch" + the Branch Tag label: the branch name, for the board''s branch filter. Missing = off.'
    at: src/components/TaskCard/TaskCard.tsx:23
  - name: status
    type: ReactNode
    default: To do
    required: false
    doc: >-
      Figma Status (Tag, style=line): the status in words. Default "To do". Shown only with `showTag`; otherwise screen readers still hear
      it.
    at: src/components/TaskCard/TaskCard.tsx:25
  - name: showTag
    figmaName: Show tag
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'Figma "Show tag" (off by default, batch 4, 22 Nov: on the board the border says the status, so the Tag no longer repeats it).'
    at: src/components/TaskCard/TaskCard.tsx:27
  - name: statusTone
    figmaName: tone
    type: StatusDotProps['tone']
    values:
      - success
      - info
      - attention
      - danger
      - neutral
    default: neutral
    required: false
    doc: >-
      Figma "tone": the Tag's tone and the card's 2px border colour (21 Nov publish, her pick B · coloured border, no bar). neutral is
      Figma's tone=default, "To do".
    at: src/components/TaskCard/TaskCard.tsx:29
  - name: dragging
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'Figma "state=dragging": the card is being dragged and lifts (shadow/lg). hover and focus are CSS states.'
    at: src/components/TaskCard/TaskCard.tsx:31
  - name: progress
    figmaName: Show progress
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      Figma "Show progress" (off by default: existing cards are unchanged, 22 Nov). Shows the progress zone between the head and the ↗ row:
      a Progress bar with "n of m" beside it, then the step now.
    at: src/components/TaskCard/TaskCard.tsx:33
  - name: progressDone
    type: number
    default: '0'
    required: false
    doc: 'progress: steps done.'
    at: src/components/TaskCard/TaskCard.tsx:35
  - name: progressTotal
    type: number
    default: '0'
    required: false
    doc: 'progress: steps in all.'
    at: src/components/TaskCard/TaskCard.tsx:37
  - name: stepNow
    type: string
    required: false
    doc: 'progress: the step running now (one line, cut with an ellipsis).'
    at: src/components/TaskCard/TaskCard.tsx:39
  - name: progressLeft
    type: number
    required: false
    doc: >-
      progress: steps left (feedback plan, 23 Nov: every card shows steps done, the step running and what is left). Shown as "3 left" in the
      line under the step.
    at: src/components/TaskCard/TaskCard.tsx:41
  - name: since
    type: string | number
    required: false
    doc: 'progress: when the run started (ISO or epoch ms). The line under the step counts up from it, every second. Not while paused.'
    at: src/components/TaskCard/TaskCard.tsx:43
  - name: lastStepAt
    type: string | number
    required: false
    doc: >-
      progress: when the last step finished (ISO or epoch ms). The line says "last step 12 s ago", so a long quiet step reads as alive and
      slow, not stuck. Not while paused.
    at: src/components/TaskCard/TaskCard.tsx:45
  - name: paused
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'progress: dragged back to Next: a grey ring and "Paused · {stepNow}" instead of the turning arc and "Now · {stepNow}".'
    at: src/components/TaskCard/TaskCard.tsx:47
  - name: stopped
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      progress: the run stopped or failed (second-pass D6, 23 Nov): a red cross ring, "Stopped · {stepNow}" with the reason wrapped (never
      cut), the bar in the danger tone, and no clock.
    at: src/components/TaskCard/TaskCard.tsx:49
  - name: href
    type: string
    required: false
    doc: 'The whole card opens the task: a link.'
    at: src/components/TaskCard/TaskCard.tsx:51
  - name: onOpen
    type: () => void
    required: false
    doc: 'The whole card opens the task: a button. Ignored when `href` is set.'
    at: src/components/TaskCard/TaskCard.tsx:53
  - name: onMoveTo
    type: () => void
    required: false
    doc: >-
      Figma "Move to…": its own button beside the drag handle (the handle only drags, 24 Nov 2026), the keyboard and click way to move
      the card; open a Menu of lanes from here. Missing = no Move to… button, the handle still drags.
    at: src/components/TaskCard/TaskCard.tsx:55
  - name: draggable
    type: boolean
    values:
      - true
      - false
    required: false
    doc: Native drag, wired by the board.
    at: src/components/TaskCard/TaskCard.tsx:57
  - name: onDragStart
    type: DragEventHandler<HTMLElement>
    required: false
    at: src/components/TaskCard/TaskCard.tsx:58
  - name: onDragEnd
    type: DragEventHandler<HTMLElement>
    required: false
    at: src/components/TaskCard/TaskCard.tsx:59
  - name: entering
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      Arrives (rule "Motion that shows what happened", items 4 and 6): a new card in Needs you, or one Undo brings back, pops in once on
      motion/duration/250 and motion/easing/pop. Set it only on the card that is new, never on first load. Reduced motion: it is simply
      there.
    at: src/components/TaskCard/TaskCard.tsx:66
  - name: leaving
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      Leaves (item 6, Accept): the card slides out to the right and fades on motion/duration/250, then onLeft runs so the page removes it.
      Reduced motion: onLeft runs at once.
    at: src/components/TaskCard/TaskCard.tsx:72
  - name: onLeft
