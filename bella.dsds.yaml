    description: Signature near-black with a warm plum undertone. Primary text on light surfaces; the light-mode inverse surface.
    metadata:
      origin:
        method: extracted
        author: machine-assisted
        note: Description and usage rules extracted from tokens/bella.json; the DTCG file stays the source of truth for the value.
      reviewed:
        - date: "2026-07-21"
          by: human:elleta
          note: "16.06:1 on ground #F5F4EF, 16.92:1 on paper #FAFAF8, AAA everywhere on light surfaces."
      tags:
        - primitive
        - color
      group: color.brand
    sections:
      - kind: guidelines
        for: all
        framing: when-to-use
        title: Where it is used
        items:
          - level: may
            statement: High-contrast text on ground and paper
          - level: may
            statement: Inverse (dark) sections embedded in light pages
          - level: may
            statement: Light-mode link color (affordance is underline + iris hover)
      - kind: guidelines
        for: all
        title: How to use it
        items:
          - level: must-not
            statement: Do not use as body text on navy — use navy.ink instead
          - level: must-not
            statement: "Do not use pure #000 — ink is warmer"
    related:
      - to: color.brand.navy
        rel: relates-to
        note: dark-mode page
      - to: color.neutral.ink-soft
        rel: relates-to
        note: / ink-muted (the light ink ladder)
    tokenType: color
    source:
      href: ./tokens/bella.json
      rel: file
      role: primitive.color.brand.ink
