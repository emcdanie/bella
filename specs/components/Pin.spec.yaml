      kind: This one
    - task: Showing a status
      answer: → Use StatusPill
      visual: StatusPill
      kind: Instead
    - task: A short label on content
      answer: → Use Tag
      visual: Tag
      kind: Instead
    - task: Naming an icon button
      answer: → Use Tooltip
      visual: Tooltip
      kind: Instead
