        (pink accent-1, yellow accent-2, blue utility/info-knockout, red utility/error-knockout, green utility/success-knockout), number
        Geist Mono 16. label=true adds the part’s name. Pin colours are for pins and leaders only, never a status.
      category: '123:0'
