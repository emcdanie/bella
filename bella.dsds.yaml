  - kind: component
    id: button
    name: Button
    description: "Keycaps with real hierarchy: an ink primary keycap, an outlined secondary, an ink text tier; one primary per view (brand refresh, 2026-09-22: no accent colour on buttons, the ochre ring means focus only). Labels are Geist caps, never Unique."
    metadata:
      origin:
        method: extracted
        author: machine-assisted
        note: Extracted from the BELLA contract in tokens/component.json and the component’s own TSDoc. Not hand-written for this document.
      reviewed:
        - date: "2026-09-22"
          by: human:elleta
          note: primary label (text-inverse) 16.0:1 on the ink plate, 10.6:1 light / 11.8:1 dark on the hover plate (AAA). Secondary and tertiary labels are ink, 16.7:1 on panel. Secondary outline border-strong 3.00:1 worst (non-text AA). Focus ring 3px ochre-deep (3.20:1 on panel) / ochre (8.70:1 on the dark surface), 3px offset, focus-visible only.
      tags:
        - component
        - button
    sections:
      - kind: guidelines
        for: all
        framing: when-to-use
        title: Where it is used
        items:
          - level: may
            statement: Hero CTA
          - level: may
            statement: Card 'Read more' action
          - level: may
            statement: Form submit
          - level: may
            statement: Contact send
          - level: may
            statement: Nav call to action (shape pill)
          - level: may
            statement: The primary contact CTA reads "Let's talk" (brand refresh, 2026-09-22)
      - kind: guidelines
        for: all
        title: Do not
        items:
          - level: must-not
            statement: "Do not render more than one primary per view: the keycap is the single 3D moment"
          - level: must-not
            statement: "Do not use for filters, toggles, or sort: that is FilterChip / SegmentedControl / Select territory"
          - level: must-not
            statement: Do not set labels in Unique at any size
          - level: must-not
            statement: "Do not build a neutral keycap: that tier is retired"
          - level: must-not
            statement: "Do not lift a button on hover: lift is reserved for cards; hover is the label roll"
          - level: must-not
            statement: "Do not add the trace ring to a button: the trace is Card's affordance"
      - kind: definitions
        for: all
        title: At rest
        description: "One job per state. At rest the keycap is calm: plate, gloss, edge, resting key shadow, label. Hover and focus-visible roll the label and shift the colour on every tier (primary plate, secondary fill, tertiary label); the button never lifts. Active is the keycap press, primary only. Reduced motion: colour only, the shift stays and the roll and press drop. audit:quality asserts the invariants on every story rendering the component (root carries data-bella-component=button)."
        context: anatomy
        items:
          - term: plate gradient + gloss
            definition: "Trigger: rest. Paints at rest."
          - term: 1px accent-raised-edge border
            definition: "Trigger: rest. Paints at rest."
          - term: shadow.key-resting
            definition: "Trigger: rest. Paints at rest."
          - term: label
            definition: "Trigger: rest. Paints at rest."
          - term: label roll
            definition: "Trigger: hover, focus. Inert at rest; audit:quality asserts it."
          - term: primary plate shift
            definition: "Trigger: hover, focus. Inert at rest."
          - term: secondary fill shift
            definition: "Trigger: hover, focus. Inert at rest."
          - term: tertiary colour shift
            definition: "Trigger: hover, focus. Inert at rest."
          - term: keycap press (primary)
            definition: "Trigger: active. Inert at rest; audit:quality asserts it."
          - term: secondary fill deepen
            definition: "Trigger: active. Inert at rest."
      - kind: definitions
        for: all
        title: Anatomy
        description: Numbered parts, bottom layer first. Each names its DOM target inside the component root, so a viewer can measure where it sits.
        context: anatomy
        items:
          - term: 1. Key shadow
            definition: 1px 3px 0 ink, soft drop, inset highlight (primary). Token --shadow-key-resting; target :scope.
          - term: 2. Fill
            definition: ink plate, 1px edge, white-alpha gloss. Token --component-button-primary-fill-hi; target :scope.
          - term: 3. Box
            definition: 44px min, padding 12 / 20, radius 12. Token --component-button-primary-min-height; target :scope.
          - term: 4. Label
            definition: Geist 13, 700, caps, 0.08em. Token --component-button-primary-font-size; target [data-bella-roll=label].
          - term: 5. Focus ring
            definition: 3px, 3px offset, focus-visible only. Token --ring-focus-color; target :scope.
    refs:
      - href: ./src/components/Button/Button.stories.tsx
        rel: storybook
        role: CSF story source
    sourceFiles:
      - platform: react
        file: ./src/components/Button/Button.tsx
    specs:
      - href: ./tokens/component.json
        rel: contract
        role: BELLA component contract ($extensions.bella)
        note: Checked against the exported Props interface by scripts/contract-parity.mjs.
    traits:
      - kind: enum
        id: variant
        description: Which visual treatment to render.
        setBy: consumer
        values:
          - id: primary
            description: The raised keycap, the one 3D moment in a view; render at most ONE per view.
          - id: secondary
            description: The flat accent outline.
          - id: tertiary
            description: "The text tier: accent and underlined, nothing else."
      - kind: enum
        id: shape
        description: Outline shape, quoted from the Button TSDoc.
        setBy: consumer
        values:
          - id: default
            description: The keycap radius every tier shares.
          - id: pill
            description: Rounds the ends fully (e.g. a nav call to action).
      - kind: boolean
        id: disabled
        description: "Disabled state: muted surface, no elevation, no affordances. Buttons only, not links."
        setBy: consumer
    $extensions:
      design.bella:
        context: "BELLA contract facts DSDS has no typed field for: the runtime state list (no per-state description exists to satisfy a trait’s required `description`), and the machine-checked rest-state invariants."
        states:
          - default
          - hover
          - active
          - focus
          - disabled
        restState:
          description: "One job per state. At rest the keycap is calm: plate, gloss, edge, resting key shadow, label. Hover and focus-visible roll the label and shift the colour on every tier (primary plate, secondary fill, tertiary label); the button never lifts. Active is the keycap press, primary only. Reduced motion: colour only, the shift stays and the roll and press drop. audit:quality asserts the invariants on every story rendering the component (root carries data-bella-component=button)."
          atRest:
            - plate gradient + gloss
            - 1px accent-raised-edge border
            - shadow.key-resting
            - label
          triggered:
            - layer: label roll
              "on":
                - hover
                - focus
              asserted: true
            - layer: primary plate shift
              "on":
                - hover
                - focus
              asserted: false
            - layer: secondary fill shift
              "on":
                - hover
                - focus
              asserted: false
            - layer: tertiary colour shift
              "on":
                - hover
                - focus
              asserted: false
            - layer: keycap press (primary)
              "on":
                - active
              asserted: true
            - layer: secondary fill deepen
              "on":
                - active
              asserted: false
          invariants:
            - layer: press
              property: transform
              expect: none
            - layer: label roll
              type: translate-y
              selector: "[data-bella-roll=copy]"
              expect: 100%
            - layer: label roll
              type: translate-y
              selector: "[data-bella-roll=label]"
              expect: 0%
            - layer: label roll underline
              type: single-underline
              window: "[data-bella-roll=window]"
              selector: "[data-bella-roll=label], [data-bella-roll=copy]"
              underlinedVariant: tertiary
