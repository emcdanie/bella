name: Progress
lead:
  text: A measured amount.
  source: tokens/contracts.json description, up to the first colon or semicolon
category: Data
rendersAs: null
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-data-progress--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/Progress/Progress.tsx
  storyTitle: Components/Data/Progress
props:
  - name: label
    figmaName: Label
    type: ReactNode
    required: true
    doc: Figma "Label". What is measured. Stays the accessible name when hidden.
    at: src/components/Progress/Progress.tsx:79
  - name: value
    figmaName: Value
    type: ReactNode
    required: false
    doc: Figma "Value". The amount in words ("60%", "4 of 6").
    at: src/components/Progress/Progress.tsx:81
  - name: showLabel
    figmaName: Show label
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: Figma "Show label". Off hides the Head (label and value) visually.
    at: src/components/Progress/Progress.tsx:83
  - name: showTarget
    figmaName: Show target
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'Figma "Show target". Bar only: a 32 row above the track with a "Target n%" label and a dashed line at `target`.'
    at: src/components/Progress/Progress.tsx:85
  - name: shape
    figmaName: shape
    type: '''bar'' | ''segments'' | ''ring'''
    values:
      - bar
      - segments
      - ring
    default: bar
    required: false
    doc: Figma "shape".
    at: src/components/Progress/Progress.tsx:87
  - name: tone
    figmaName: tone
    type: ProgressTone
    default: info
    required: false
    doc: Figma "tone". Status colours for status only.
    at: src/components/Progress/Progress.tsx:89
  - name: fill
    type: number
    default: '0'
    required: false
    doc: 'Figma "Fill · value" (bar, ring): 0 to 100.'
    at: src/components/Progress/Progress.tsx:91
  - name: target
    type: number
    default: '0'
    required: false
    doc: 'Figma "Target · target" (bar): 0 to 100.'
    at: src/components/Progress/Progress.tsx:93
  - name: targetLabel
    type: string
    required: false
    doc: The target label in its own unit ("Target 7:1"); default "Target n%". Bar only, with showTarget.
    at: src/components/Progress/Progress.tsx:95
  - name: showTargetLabel
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: >-
      Bar with a target: false draws the thin tick only, with no "Target" tag and no 32 row for it (23 Nov). The target is still said in the
      summary and callout. Default true.
    at: src/components/Progress/Progress.tsx:97
  - name: parts
    type: ProgressPart[]
    required: false
    doc: >-
      Bar only: a bar in parts (23 Nov, Gaps: "specified, not in code" beside "not in BELLA yet"). Each part is a share of the whole track,
      0 to 100, drawn one after another from the start; `fill` is ignored. Each says what it is in `label`, which is spoken ("12 specified,
      not in code, 8 not in BELLA yet") and never drawn on the bar.
    at: src/components/Progress/Progress.tsx:103
  - name: segments
    type: number
    default: '5'
    required: false
    doc: 'Segments only: how many steps (Figma draws 6; the gate uses 5).'
    at: src/components/Progress/Progress.tsx:105
  - name: done
    type: number
    default: '0'
    required: false
    doc: 'Segments only: how many are done.'
    at: src/components/Progress/Progress.tsx:107
  - name: drawIn
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      Draws in once when it first appears: the bar grows, the ring sweeps, the segments fill, to the value on motion/duration/450 and
      motion/easing/out; the target is there before the mark arrives. Reduced motion: drawn at once. A demo for Health charts (21 Nov:
      "should we not put motion on the graphs??"), off by default.
    at: src/components/Progress/Progress.tsx:112
  - name: callout
    type: boolean | string
    default: false
    required: false
    doc: >-
      The chart callout (22 Nov, CHIP chart language): hover or keyboard focus on the bar shows BELLA's Tooltip 16 under the track, pointing
      up, with the amount and the target ("60% · target 90%"). true writes that text from `value` and `target`; a string says it instead ("4
      of 5 · target 80%"). On, the bar takes keyboard focus. Off by default, so rows of bars add no tab stops.
    at: src/components/Progress/Progress.tsx:119
  - name: summary
    type: string
    required: false
    doc: >-
      The chart's one-line summary (22 Nov reading: every chart has a summary behind it), read as the bar's description (aria-describedby)
      and never drawn. Missing: written from the data, e.g. "Contrast coverage: 95%, target 80%, above target".
    at: src/components/Progress/Progress.tsx:125
  - name: className
    type: string
    required: false
    at: src/components/Progress/Progress.tsx:126
  - name: style
    type: CSSProperties
    required: false
    at: src/components/Progress/Progress.tsx:127
