usage:
  use:
    - 'Atlas Try a change: one slider per tunable token, marks at the rules (24px WCAG 2.5.8, 44px BELLA floor)'
    - Any bounded number people tune by feel and then fine-tune by typing
  dont:
    - 'Do not use it for a choice between a few named options: that is SegmentedControl or Select'
    - 'Do not hide the number: the value always shows beside the track and can be typed'
    - 'Do not put a mark without a label: a mark says which rule lives there'
  source: tokens/component.json
