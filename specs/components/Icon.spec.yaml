# SCHEMA: best-effort, in the style of specs-cli; verify against specs-cli docs
# Generated by scripts/spec-build.mjs. Do not edit by hand except the `guidance:` block.
name: Icon
lead:
  text: The only way BELLA renders an icon. Iconoir glyphs from an inlined registry, icon-token sized, always currentColor.
  source: tokens/component.json description, up to the first colon or semicolon
category: Data
rendersAs: null
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-icon--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/Icon/Icon.tsx
  storyTitle: Components/Icon
props:
  - name: name
    type: IconName
    required: true
    at: src/components/Icon/Icon.tsx:7
  - name: size
    type: '''sm'' | ''md'' | ''lg'''
    values:
      - sm
      - md
      - lg
    default: md
    required: false
    doc: 'Size step from the icon ramp: sm 16, md 20, lg 24.'
    at: src/components/Icon/Icon.tsx:9
  - name: label
    type: string
    required: false
    doc: Decorative by default (aria-hidden). Pass a label to make it meaningful (role=img).
    at: src/components/Icon/Icon.tsx:11
  - name: className
    type: string
    required: false
    doc: Extra classes on the svg.
    at: src/components/Icon/Icon.tsx:13
  - name: style
    type: CSSProperties
    required: false
    at: src/components/Icon/Icon.tsx:14
variants:
  size:
    values:
      - sm
      - md
      - lg
    default: md
    at: src/components/Icon/Icon.tsx:9
states:
  contract:
    - default
  css: []
sizes:
  - value: sm
    default: false
    css: []
  - value: md
    default: true
    css: []
  - value: lg
    default: false
    css: []
anatomy:
  scaleWidth: 320
  parts:
    - 'n': 1
      name: Glyph
      type: GUIDANCE
      layer: Glyph
      at: centre
      side: right
      from: guidance.anatomyParts (a component whose parts sit in one row needs them named by hand)
  figma:
    name: name=ViewGrid, size=md, tone=primary
    type: COMPONENT
    size: 20x20
    children:
      - name: Glyph
        type: VECTOR
        size: 15x15
        tokens:
          - field: strokes
            variable: color/semantic/text-primary
  code: []
tokens:
  used: []
  values: {}
motion:
  transitions: []
  reducedMotion: null
  reducedMotionQuery: false
a11y:
  element: null
  role: null
  nameSource:
    value: visible content
    at: null
  keyboard: []
  aria:
    - attribute: aria-label
      value: label
      at: src/components/Icon/Icon.tsx:33
    - attribute: aria-hidden
      value: label
      at: src/components/Icon/Icon.tsx:34
  focusRing: []
  disabled:
    prop: null
    note: no disabled prop
  reducedMotion: null
  contract: >-
    Verified 2026-07-22: aria-hidden by default (decorative); with label, role=img plus aria-label. Colour is always currentColor, so
    contrast rides on the text token of the context. Sizes from the icon tokens (sm 16 / md 20 / lg 24), stroke from icon.stroke.
  targetPx: null
  ariaChips:
    - kind: ARIA
      value: aria-label
      at: src/components/Icon/Icon.tsx:33
    - kind: ARIA
      value: aria-hidden
      at: src/components/Icon/Icon.tsx:34
contrast:
  pairs:
    - label: Muted icon on a card
      foreground: '--color-semantic-icon-muted'
      background: '--color-semantic-surface-card'
      foregroundHex: '#686d7d'
      backgroundHex: '#ffffff'
      ratio: 5.16
      bar: 3
      barName: NON_TEXT
      pass: true
      theme: chip
      at: guidance.contrastExtra
    - label: Icon in body ink on a card
      foreground: '--color-semantic-text-body'
      background: '--color-semantic-surface-card'
      foregroundHex: '#2b2f3d'
      backgroundHex: '#ffffff'
      ratio: 13.32
      bar: 3
      barName: NON_TEXT
      pass: true
      theme: chip
      at: guidance.contrastExtra
  derived: []
codeExample:
  file: ~/DEV/bella-storybook-brand/src/components/Icon/Icon.stories.tsx
  lines: 40-40
  import: import Icon from '@bella/components/Icon/Icon';
  importSource: the style the Button doc page uses (CHIP import path)
  code: <Icon name="ViewGrid" size={size} />
usage:
  use:
    - Segment glyphs
    - The Select chevron
    - Any leading icon slot
  dont:
    - >-
      Do not put id attributes inside an icon SVG: the glyph renders more than once (the Button label roll duplicates it), so an
      id-referenced gradient or clip would collide; draw with paths and currentColor only (audit:quality enforces)
    - >-
      Do not mix icon sets or draw one-off SVGs: Iconoir is the ONLY source (declared 2026-07-22) and every glyph lives in the registry,
      nothing inline (audit:quality enforces)
    - 'Do not import an icon library component surface: the registry carries the paths BELLA ships (borrow-behavior-only, recorded)'
    - 'Do not hardcode an icon colour: currentColor inherits the themed ink'
    - >-
      Do not let a meaningful icon stand without text unless its accessible name is proven in a Behavior story; decorative is the default
      and needs no name
  source: tokens/component.json
