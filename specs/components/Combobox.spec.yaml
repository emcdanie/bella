        the field. Hint with a Kbd key.
      category: '123:0'
    - label: >-
        role=combobox with aria-expanded, aria-controls and aria-autocomplete=list; the active option via aria-activedescendant, so focus
        stays in the field. ↓/↑ move, Enter picks, Esc closes then clears. Focus ring color/border/focus, 4px wide with a 4px gap. Text
        7.34:1 or more (disabled included).
      category: '123:2'
    - label: |-
        The list appears without sliding; edge and ring change over motion/duration/fast.
        Reduced motion: instant.
