<!-- Figtree + Geist Mono for the manager chrome only. The preview iframe deliberately does
     NOT load them: stories snapshot with the system fallback, and adding a
     webfont there would invalidate every visual baseline.
     Unique is retired (2026-10-08): the sidebar lockup is the SVG wordmark in theme.ts. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap"
/>
<!-- Story UI: the manager page (?path=/workspace/) reads the server port from this tag.
     Written by `story-ui init`; `story-ui update` refreshes it. -->
<meta name="story-ui-port" content="4001">
