usage:
  use:
    - Work library view switcher (Cards / Map / Table)
    - Any mutually exclusive view pick with few options
  dont:
    - 'Do not use for multi-select: that is FilterChip'
    - >-
      Do not use radiogroup or tablist semantics: plain buttons with aria-current, per the recorded discovery pass (W3C APG radio rejected:
      single tab stop plus arrow-select blocks surveying; Primer SegmentedControl guidance matches)
    - 'Do not hide options behind it: if they do not all fit, it is a Select'
