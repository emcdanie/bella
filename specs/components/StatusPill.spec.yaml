props:
  - name: variant
    type: '''accent'' | ''success'' | ''info'' | ''neutral'' | ''attention'' | ''danger'' | ''quiet'' | ''serving'''
    values:
      - accent
      - success
      - info
      - neutral
      - attention
      - danger
      - quiet
      - serving
    default: accent
    required: false
    doc: >-
      The state tint. `"accent"` is the pink fill with a near-black label (the portfolio's "Current focus"; shared look, 8 Nov 2026).
      `"success"` and `"info"` wear the carried sage and steel tints, non-text roles only per the recorded decision. `"neutral"` has no
      tint: the inset fill and a hairline. Status-ladder variants (Elleta, 14 Oct 2026): `"attention"` = warning / waiting (yellow fill);
      `"danger"` = failed (dot + wash on raised surface); `"quiet"` = parked / inactive (muted fill); `"serving"` = success outline.
    at: src/components/StatusPill/StatusPill.tsx:15
  - name: shape
    type: '''pill'' | ''dot'''
    values:
      - pill
      - dot
    default: pill
    required: false
    doc: >-
      `"dot"` shows only a coloured mark in the state's colour; the word stays the accessible name, visually hidden (CHIP's Today, Elleta 7
      Nov 2026).
    at: src/components/StatusPill/StatusPill.tsx:20
  - name: className
    type: string
    required: false
    doc: Extra classes on the pill.
    at: src/components/StatusPill/StatusPill.tsx:22
  - name: children
    type: ReactNode
    required: false
    at: src/components/StatusPill/StatusPill.tsx:23
