guidance:
  lead: Starts an action. Three tiers, one primary per view.
  whenToUse:
    - task: The main action in a view
      answer: ✓ Use Button
      visual: Button
      visualVariant: variant=primary, state=default, iconOnly=false, shape=default, size=default
      kind: This one
    - task: A small repeated action under a card
      answer: → Use ActionChip
      visual: ActionChip
      kind: Instead
    - task: Filtering, toggling or sorting
      answer: → Use FilterChip
      visual: FilterChip
      kind: Instead
    - task: Going to another page from a sentence
      answer: → Use Link
      visual: Link
      kind: Instead
  doDont:
    - do:
        rule: Say what happens
        text: Send message
        state: default
      dont:
        rule: Never a vague label
        text: Click here
        state: default
    - do:
        rule: Sentence case
        text: Save changes
        state: default
      dont:
        rule: Never all capitals
        text: SAVE CHANGES
        state: default
