name: Stat
lead:
  text: One figure with its label and an optional change. A term-description pair.
  source: tokens/contracts.json description, up to the first colon or semicolon
category: Data
rendersAs: null
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-data-stat--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/Stat/Stat.tsx
  storyTitle: Components/Data/Stat
props:
  - name: label
    figmaName: Label
    type: string
    required: true
    doc: What is counted, as a short Mono label.
    at: src/components/Stat/Stat.tsx:9
  - name: value
    figmaName: Value
    type: string | number
    required: true
    doc: The figure. Numbers set in tabular figures.
    at: src/components/Stat/Stat.tsx:11
  - name: delta
    figmaName: Delta
    type: string
    required: false
    doc: Change or context under the figure (`"2 since last sync"`). Plain text; the trend arrow is added for you.
    at: src/components/Stat/Stat.tsx:13
  - name: trend
    figmaName: trend
    type: '''up'' | ''down'''
    values:
      - up
      - down
    required: false
    doc: 'Direction of the delta: an arrow plus a spoken word, never colour. Omit for a neutral note.'
    at: src/components/Stat/Stat.tsx:15
  - name: series
    figmaName: series
    type: number[]
    required: false
    doc: Earlier values, oldest first, ending with the current one. Two or more draw a sparkline; fewer draw nothing.
    at: src/components/Stat/Stat.tsx:17
  - name: seriesLabel
    type: string
    required: false
    doc: 'What the sparkline says, spoken in place of the drawing. Defaults to "<label>: <first> to <last> over <n> points".'
    at: src/components/Stat/Stat.tsx:19
  - name: seriesLabels
    type: string[]
    required: false
    doc: 'One name per point, same order as `series` ("Mon", "10:00"): the scrubber''s callout says it after the value.'
    at: src/components/Stat/Stat.tsx:21
  - name: summary
    type: string
    required: false
    doc: >-
      The sparkline's one-line summary (22 Nov reading: every chart has a summary and a table behind it), read as its description
      (aria-describedby), never drawn. Missing: written from the series, e.g. "Components: up 6 from 18 to 24, low 18 (Mon), high 24 (Sun)".
    at: src/components/Stat/Stat.tsx:27
  - name: table
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: The sparkline's points as a visually hidden table (name and value per row, from `seriesLabels` and `series`). Default true.
    at: src/components/Stat/Stat.tsx:29
  - name: range
    type: string
    required: false
    doc: >-
      The span the series covers, picked by the parent's D/W/M/Y control, in words ("this week"). Spoken with the sparkline. A new range
      brings a new `series`; the line morphs point by point from the old one over motion/duration/450, never redrawn from zero.
    at: src/components/Stat/Stat.tsx:35
  - name: icon
    figmaName: icon
    type: IconName
    required: false
    doc: An Iconoir glyph in a round well above the label (BellaComponents, 11 Nov 2026). Decorative.
    at: src/components/Stat/Stat.tsx:37
  - name: measure
    type: number
    required: false
    doc: How full the measure is, 0 to 1, drawn as a bar under the figure. Spoken with `measureLabel`.
    at: src/components/Stat/Stat.tsx:39
  - name: measureLabel
    type: string
    required: false
    doc: 'What the bar says, spoken in place of the drawing. Defaults to "<label>: <n>%".'
    at: src/components/Stat/Stat.tsx:41
  - name: measured
    figmaName: measured
    type: boolean
    values:
      - true
      - false
    default: true
    required: false
    doc: >-
      False when there is no real figure yet: only the label and "Not measured" show; no bar, sparkline or change line. Never invent a
      figure. Default true.
    at: src/components/Stat/Stat.tsx:43
  - name: size
    type: '''default'' | ''display'''
    values:
      - default
      - display
    default: default
    required: false
    doc: >-
      `"display"` is the presenting size (deck plan, 23 Nov 2026): the figure in Geist Mono Bold 88 for a slide read from the back of a
      room. Default `"default"` is the 40 card figure. The label, change line and sparkline keep their sizes; the 16 floor is untouched.
    at: src/components/Stat/Stat.tsx:49
  - name: className
    type: string
    required: false
    doc: Extra classes on the root.
    at: src/components/Stat/Stat.tsx:51
variants:
  trend:
    values:
      - up
      - down
    default: null
    at: src/components/Stat/Stat.tsx:15
  size:
    values:
      - default
      - display
    default: default
    at: src/components/Stat/Stat.tsx:49
