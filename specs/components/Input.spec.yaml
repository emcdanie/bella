guidance:
  lead: Labelled free-text entry. The label is always shown and the error always says why.
  whenToUse:
    - task: Free text (name, email, message)
      answer: ✓ Use Input
      visual: Input
      visualVariant: state=default, disabled=false, error=false, multiline=false
      kind: This one
    - task: Picking from known options
      answer: → Use Select
      visual: Select
      kind: Instead
    - task: Searching a long list
      answer: → Use Combobox
      visual: Combobox
      visualTexts:
        Value: Search options
      kind: Instead
    - task: Choosing a number in a range
      answer: → Use Slider
      visual: Slider
      kind: Instead
  doDont:
    - do:
        rule: Say what to fix, beside the field
        vp:
          error: 'true'
        texts:
          Message: Add an @, like you@studio.com
      dont:
        rule: Say only that it failed
        vp:
          error: 'true'
        texts:
          Message: Invalid
    - do:
        rule: Show an example in the placeholder
        props:
          label: Email
          value: you@studio.com
      dont:
        rule: Put the instructions in the placeholder
        props:
          label: Email
          value: Type your work address here
  anatomyParts:
    - name: Label
      at: top
      side: left
    - name: Field
      at: top
      side: left
    - name: Value
      at: centre
      side: left
    - name: Hint or error
      layer: HelperText
      at: bottom
      side: left
  inContext:
    intro: A contact form, three fields.
    form:
      - props:
          label: Name
          value: Your name
          hint: false
      - props:
          label: Email
          value: you@studio.com
          required: true
      - vp:
          multiline: 'true'
        props:
          label: Message
          value: What are you working on?
          hint: false
  whenColumns: 2
  glance:
    - Native input or textarea
    - Error says why
    - Label always shown
  overviewIntro: Single line and multiline, in the default state.
  overview:
    - use: Single line
      vp:
        multiline: 'false'
    - use: Multiline
      vp:
        multiline: 'true'
      props:
        label: Message
        value: Tell us about the project
        hint: false
  doDontIntro: Say why a field failed, and keep its label.
  contrastVarMap: {}
  contrastSkip: []
  contrastExtra:
    - label: error border on surface
      foreground: '--color-semantic-danger-border'
      background: '--color-semantic-surface'
      bar: NON_TEXT
    - label: placeholder on field
      foreground: '--color-semantic-text-muted'
      background: '--color-semantic-surface'
      bar: AA
    - label: error message on surface
      foreground: '--color-semantic-danger-text'
      background: '--color-semantic-surface'
      bar: AA
    - label: disabled text
      foreground: '--color-semantic-text-muted'
      background: '--color-semantic-surface-inset'
      bar: AA
    - label: focus edge on surface
      foreground: '--color-semantic-border-ink'
      background: '--color-semantic-surface'
      bar: NON_TEXT
  a11yTag: WxH
  focusRingRadius: 8 radius
  focusRingScale: 1
  contrastSample: Email
  a11yRule: One tab stop. A real label, so a click or screen reader lands on the field.
  a11yChips:
    - kind: Role
      value: textbox
    - kind: Name
      value: Label, by for and id
    - kind: Focus order
      value: Tab stop
      num: '1'
  motionRows: []
  propNotes: {}
  propSpecimens:
    multiline:
      - vp:
          multiline: 'true'
    error:
      - vp:
          error: 'true'
    disabled:
      - vp:
          disabled: 'true'
    required:
      - props:
          required: true
    hint:
      - props:
          hint: true
  codeExample:
    code: <Input label="Email" value={email} onChange={setEmail} required />
  anatomyScaleWidth: 480
  codeOnly:
    - name: type
      why: HTML input type (text, email, url) for keyboard and validation; the field looks the same
