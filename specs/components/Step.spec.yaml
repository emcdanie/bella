    default: true
    required: false
    doc: Figma "Show connector". The line to the next marker; off on the last step.
    at: src/components/Step/Step.tsx:41
  - name: tag
    figmaName: Show tag
    type: ReactNode
    required: false
    doc: Figma "Show tag". The status Tag on the right edge, top-aligned with the title (vertical; her pick B, 22 Nov). Missing = off.
    at: src/components/Step/Step.tsx:43
  - name: time
    figmaName: Time
    type: ReactNode
    required: false
    doc: >-
      Figma "Time" + "Show time". On the title line after a dot, a meta line (Geist Mono 14 on 20; vertical; her pick B, 22 Nov). A long
      title wraps and takes the dot and time with it. Missing = off.
    at: src/components/Step/Step.tsx:45
  - name: timeUnderTitle
    figmaName: Show time under title
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'Figma "Show time under title": put the time on its own line under the title instead of on the title line. Default false.'
    at: src/components/Step/Step.tsx:47
  - name: showLineAbove
    figmaName: Show line above
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'Figma "Show line above". Vertical: the line into this marker; off on the first row.'
    at: src/components/Step/Step.tsx:49
  - name: state
    figmaName: state
    type: StepState
    default: done
    required: false
    doc: >-
      Figma "state". done = check in a soft success circle; current = the turning ProgressRing (22 Nov; the numbered ring when `number` is
      set); pending = neutral; failed = it ran and did not pass (the gate failed): the danger Icon well with the Xmark, title and detail in
      ink, no working tint.
    at: src/components/Step/Step.tsx:51
  - name: layout
    figmaName: layout
    type: '''horizontal'' | ''vertical'''
    values:
      - horizontal
      - vertical
    default: vertical
    required: false
    doc: Figma "layout". horizontal = a pipeline (marker and connector on top, text under); vertical = a list.
    at: src/components/Step/Step.tsx:53
  - name: selected
    figmaName: selected
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: 'Figma "selected". Vertical rows that open a record (History): light-blue row.'
    at: src/components/Step/Step.tsx:55
  - name: icon
    type: IconName
    required: false
    doc: >-
      Figma "Marker" icon swap (the kind icon). Defaults: Check, Clock by state; the current state draws ProgressRing (running, md) unless
      this or `kind` is set.
    at: src/components/Step/Step.tsx:57
  - name: kind
    type: StepKind
    required: false
    doc: >-
      The record's kind (History): its marker takes the kind's wash and an ink glyph, and wins over `state` for the marker only. docs Page
      on the yellow wash, tooling Settings on grey, tokens Palette on navy, code Code on blue, visual Eye on ochre, fix EditPencil on the
      red wash; decision a dark ink circle with a knockout glyph; merged Check on the success wash (green only for Merged). Pass `icon` to
      swap a glyph. Missing = the state's marker.
    at: src/components/Step/Step.tsx:59
  - name: number
    figmaName: Show number
    type: number
    required: false
    doc: >-
      Figma "Show number" (Show icon off): the step's number for a real sequence (rule 11). done draws a check, current the number in a 2px
