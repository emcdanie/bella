guidance:
  lead: One figure with its label and an optional change. Say "Not measured" when there is no number.
  whenToUse:
    - task: One headline figure with a label
      answer: ✓ Use Stat
      visual: Stat
      visualVariant: trend=up, series=off, measured=true, layout=stacked, tone=neutral
      kind: This one
    - task: Six scores for one system
      answer: → Use ScoreStrip
      visual: ScoreStrip
      kind: Instead
    - task: Many figures to compare across rows
      answer: → Use DataTable
      visual: DataTable
      kind: Instead
    - task: A status word, not a number
      answer: → Use StatusPill
      visual: StatusPill
      kind: Instead
  doDont:
    - do:
        rule: Show "Not measured" when there is no real figure
        vp:
          measured: 'false'
      dont:
        rule: Never type a placeholder number
        props:
          Value: '0'
  anatomyParts:
    - name: Icon well
      layer: Icon well
      at: top
      side: left
    - name: Label
      layer: Label
      at: top
      side: right
    - name: Value
      layer: Value
      at: centre
      side: left
    - name: Bar
      layer: Bar
      at: centre
      side: right
    - name: Sparkline
      layer: Line
      at: bottom
      side: left
    - name: Delta
      layer: Delta
      at: bottom
      side: right
  inContext: []
  contrastVarMap:
    '--component-stat-trend-stroke': color/semantic/text-primary
  contrastSkip: []
  anatomyProps:
    Show icon: true
    Show bar: true
    trend: up
    series: 'on'
  doDontIntro: A figure is real or it says so. Never fill the space with a zero.
  ariaLine: false
  a11yBracket: null
  a11yTag: WxH
  a11yRule: The label names the number. The arrow is hidden; Up or Down is spoken.
  a11yChips:
    - kind: Role
      value: dl, dt label, dd figure
    - kind: Name
      value: the label (dt)
  motionRows: []
  propNotes:
    label: What is counted
    value: The figure, tabular numerals
    delta: The change or context under it
    trend: up or down, spoken as well as drawn
    series: Two or more real points draw the sparkline
    seriesLabel: Spoken in place of the drawing
    icon: Decorative glyph in a round well
    measure: 0 to 1, drawn as a bar
    measureLabel: Spoken in place of the bar
