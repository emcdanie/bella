      bar: NON_TEXT
    - label: Focus ring
      foreground: '--color-semantic-focus-ring'
      background: '--color-semantic-surface'
      bar: NON_TEXT
  a11yBracket: 44
  a11yRule: One tab stop. Enter or Space presses a button, Enter follows a link. Icon-only buttons need ariaLabel.
  a11yChips:
    - kind: Role
      value: button, or link with href
    - kind: Name
      value: Visible label, or ariaLabel
    - kind: Focus order
      value: Tab stop
      num: '1'
  motionRows:
    - title: Hover
      set: Button
      before:
        variant: variant=secondary, state=default, iconOnly=false, shape=default, size=default
        caption: Rest
      after:
        variant: variant=secondary, state=hover, iconOnly=false, shape=default, size=default
        caption: Hovered
      plain: The label rolls up and a copy rolls in over 250 ms; the colour shifts over 150 ms. It never lifts.
    - title: Press
      set: Button
      before:
        variant: variant=primary, state=default, iconOnly=false, shape=default, size=default
        caption: Rest
      after:
        variant: variant=primary, state=active, iconOnly=false, shape=default, size=default
        caption: Pressed
      plain: The primary presses down 2px over 150 ms. Reduced motion keeps the colour shift and drops the roll and press.
  propNotes:
    variant: primary, secondary or tertiary
    shape: default or pill
    size: default 44, or sm 36 with a 44 tap area
    iconOnly: A 44 circle holding one icon
    href: Renders one link
    onClick: Renders a button
    type: button or submit
    disabled: Buttons only, not links
    ariaLabel: Required for icon-only
    ariaExpanded: For a button that shows or hides content
    ariaHaspopup: For a button that opens a dialog
  anatomyScaleWidth: 480
