  - kind: entry
    id: foundation-typography
    name: Typography
    description: Exactly two faces, Unique for display and Geist for everything else, over a set of size floors that are bugs to go below.
    metadata:
      origin:
        method: extracted
        author: machine-assisted
      tags:
        - foundation
        - typography
    sections:
      - kind: guidelines
        for: all
        title: The type lock
        items:
          - level: must
            statement: Unique (`typography.font-family.display`, Bold/700 the only cut) MUST be reserved for display headings, the home hero headline, and the keycap brand lockup.
            checks:
              - href: ./scripts/audit-quality-docs.mjs
                rel: lint-rule
                role: audit:quality
            checkedBy: automated
          - level: must
            statement: Geist (`typography.font-family.body`) carries everything else. Eyebrows are Geist caps with `typography.letter-spacing.wider`; the tracking is the look.
            checkedBy: manual
          - level: must-not
            statement: Unique MUST NOT render below 24px, MUST NOT take negative tracking, and MUST NOT be used for body, UI, card titles, eyebrows, nav, buttons, or chips. The keycap brand lockup is the single recorded sub-24 exception.
            checks:
              - href: ./scripts/audit-quality-docs.mjs
                rel: lint-rule
                role: audit:quality
            checkedBy: automated
          - level: must-not
            statement: "`typography.font-family.mono` is retired and repointed to Geist for legacy consumers. Do not reintroduce a mono family."
            checkedBy: manual
      - kind: guidelines
        for: all
        title: Size floors
        description: Floors, not defaults. Going below is a bug.
        items:
          - level: must
            statement: Reading text MUST be at least 18px (`typography.font-size.sm`); body is 20px (`typography.font-size.body`).
            checks:
              - href: ./scripts/audit-quality-docs.mjs
                rel: lint-rule
                role: audit:quality
            checkedBy: automated
          - level: must
            statement: Card titles MUST be 22px (`typography.font-size.xl`) at weight 500.
            checkedBy: assisted
          - level: must
            statement: Section headings MUST be at least 34px (`typography.font-size.display-section`, 34 to 40px).
            checkedBy: assisted
          - level: should
            statement: Captions are 18px and labels 16px; nothing read sits below 18px.
            checkedBy: manual
          - level: must-not
            statement: Nothing, anywhere, renders below 16px (`typography.font-size.tag`).
            checks:
              - href: ./scripts/audit-quality-docs.mjs
                rel: lint-rule
                role: audit:quality
            checkedBy: automated
    refs:
      - to: typography.font-size.base
        rel: composes
        note: One step on the type ramp. Every token in the `typography.font-size` group is a step on the same scale; DSDS has no token-group entity, so the group name is the only handle.
  - kind: entry
    id: foundation-spacing
    name: Spacing and Surface
    description: A 4px-based spacing ramp, a radius tier per surface class, and one light source shared by every raised object.
    metadata:
      origin:
        method: extracted
        author: machine-assisted
      tags:
        - foundation
        - spacing
    sections:
      - kind: guidelines
        for: all
        title: Surface behavior
        items:
          - level: must
            statement: "One light source, upper-left: highlights top-left, shadows down-right, on orbs, keycaps, and cards alike."
            checkedBy: manual
          - level: must
            statement: "Cards take their radius from the token tier: `radius.xl` for `card.default`, `radius.2xl` elevated, `radius.3xl` glass. Buttons take `radius.md`; the primary keycap plate takes `radius.lg`."
            checks:
              - href: ./scripts/contract-parity.mjs
                rel: lint-rule
                role: contract parity
            checkedBy: assisted
          - level: should
            statement: "Cards lift on hover with `motion.transform.hover-lift`. The lift is the tell: cards are objects, not panels."
            checkedBy: manual
          - level: should
            statement: Hover transitions are quick (at most 250ms) and eased.
            checkedBy: manual
          - level: must-not
            statement: The elevation tokens (`shadow.orb*`, `shadow.key-*`, `shadow.switch-*`) are a token lock. Do not flatten them; the depth IS the system.
            checkedBy: manual
          - level: must-not
            statement: No bouncing and no spring physics.
            checkedBy: manual
    refs:
      - to: spacing.4
        rel: composes
        note: One step on the spacing ramp. Every token in the `spacing` group is a step on the same scale; DSDS has no token-group entity, so the group name is the only handle.
shared:
  - id: bella-a11y
    name: The BELLA Accessibility Bar
    description: AAA-minded AA, recorded by Elleta on 2026-07-21. Stated once here and referenced from the entries it governs.
    sections:
      - kind: guidelines
        for: all
        title: AAA-minded AA
        items:
          - id: aaa-for-ink-and-body-text
            level: must
            statement: Both ink ladders MUST be verified AAA on every surface they sit on. Body text never drops below AAA.
            evidence:
              - href: https://www.w3.org/WAI/WCAG22/Understanding/contrast-enhanced.html
                rel: external-link
                role: WCAG 2.2 SC 1.4.6 (AAA)
            checkedBy: assisted
            tags:
              - accessibility
              - contrast
          - id: aa-where-the-accent-speaks
            level: must
            statement: Links and button labels are ink, so they hold AAA. The accent is a fill with ink text (9.01:1); the focus ring MUST clear 3:1 on every surface it can sit on (ochre-deep 3.20:1 on the light panel, ochre 7.28:1 on the dark raised surface). scripts/contrast-pairs.mjs checks every declared pair in both themes.
            evidence:
              - href: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
                rel: external-link
                role: WCAG 2.2 SC 1.4.3 (AA)
            checkedBy: assisted
            tags:
              - accessibility
              - contrast
          - id: worst-ground-wins
            level: must
            statement: A text token MUST pass AA normal text on the worst surface it is allowed to sit on, or its usage metadata MUST forbid that surface. Verified ratios are recorded per token, dated.
            checkedBy: assisted
            tags:
              - accessibility
              - contrast
          - id: the-accent-always-theme-flips
            level: must-not
            statement: "Ochre MUST NOT be text, a hairline or a ring on light surfaces: 2.08:1 on white and 1.86:1 on panel fail both 4.5:1 and the 3:1 non-text minimum. On light, lines and the focus ring are ochre-deep. The ring means focus only, never decoration at rest."
            checkedBy: assisted
            tags:
              - accessibility
              - contrast
