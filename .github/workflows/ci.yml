name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build + drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build tokens
        run: node tokens/build.mjs

      - name: Fail if generated artifacts drifted from sources
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated artifacts do not match token sources. Run 'npm run build' and commit the output."
            exit 1
          fi

  storybook:
    name: Storybook — a11y + interactions + theme integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit gate (fail on high/critical; allowlist in .npm-audit-allowlist.json)
        run: node scripts/npm-audit-gate.mjs

      - name: Contract parity (Tier 3 contracts ↔ shipped component APIs)
        run: node scripts/contract-parity.mjs

      - name: AGENTS.md check (consumer-first, component map ↔ src/components)
        run: node scripts/agents-md-check.mjs

      - name: Contrast pairs (declared foreground/background pairs, all themes)
        run: node scripts/contrast-pairs.mjs

      - name: Fail if bella.dsds.yaml drifted from token sources
        run: |
          node scripts/build-dsds.mjs
          if ! git diff --exit-code bella.dsds.yaml; then
            echo "::error::bella.dsds.yaml does not match token sources. Run 'node scripts/build-dsds.mjs' and commit the output."
            exit 1
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Image-snapshot baselines are per-platform (rendered on darwin locally);
      # CI runs the theme-integrity check, interactions, and a11y, and skips
      # pixel comparison until a Linux-baseline (or Docker) decision is made.
      - name: Run Storybook test suite (both themes)
        run: SKIP_VISUAL_SNAPSHOTS=1 npm run audit:visual
