  - name: icon
    figmaName: Show icon
    type: IconName
    required: false
    doc: >-
      Figma "Show icon" + "icon". An Iconoir glyph in a 48 well before the title (BellaComponents, 11 Nov 2026). Decorative: the title names
      the page.
    at: src/components/PageHeader/PageHeader.tsx:15
  - name: titleAside
    figmaName: Show switcher
    type: ReactNode
    required: false
    doc: >-
      Figma "Show switcher". Something that belongs to the title, beside it but outside the h1 (the switcher chevron, a quiet ⋯ menu), so
      the heading's name stays the title alone.
    at: src/components/PageHeader/PageHeader.tsx:17
  - name: storyLink
    figmaName: Show story link
    type: '{ label: ReactNode; href: string }'
    required: false
    doc: Figma "Show story link". A link under the title to the story behind the page, with the › Trailing mark.
    at: src/components/PageHeader/PageHeader.tsx:19
  - name: health
    figmaName: Health
    type: ReactNode
    required: false
    doc: Figma "Health" (+ "Show health"). The health line under the title, in the subtext face ("95% healthy · 13 checks to fix").
    at: src/components/PageHeader/PageHeader.tsx:21
  - name: actions
    figmaName: Show actions
    type: ReactNode
    required: false
    doc: 'Figma "Show actions". The page''s main action, top right: one primary Button.'
    at: src/components/PageHeader/PageHeader.tsx:23
  - name: size
    figmaName: size
    type: '''page'' | ''project'' | ''bar'''
    values:
      - page
      - project
      - bar
    default: page
    required: false
    doc: >-
      Figma "size" (PageHeader set 1663:281509). page (default) or project (a project's tabs). Since 22 Nov 19:08 both set the title 28 on
      36 and the meta and health lines 14 on 20. bar (CHIP, 23 Nov, "page chrome is small"): ONE 56 row. The meta (the breadcrumb's parents)
      and the title (its last segment, still the page's one h1, 22 on 28) read as one line, the page's one action at the right edge. No
      lede, health line or story link in a bar: they are left out.
    at: src/components/PageHeader/PageHeader.tsx:31
  - name: id
    type: string
