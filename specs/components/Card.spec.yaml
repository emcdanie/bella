  defaultVariant: variant=default, state=default, padding=default, Clip content=true, raised=false
  annotations:
    - label: >-
        States: only interactive cards (href or onClick; variants default and peek) take hover and focus. Hover: the edge strengthens to
        color/border/strong. Focus: the blue ring. Tinted and inset are static.
      category: '123:1'
    - label: |-
        Hover and focus: edge and ring change over motion/duration/fast. Never lifts, no resting shadow.
        Reduced motion: instant.
      category: '123:4'
    - label: >-
        <Card href onClick media> · src/components/Card/Card.tsx. Surface color/background/surface, edge border/width/1 in
        color/border/subtle, corner border/radius/card (20 in Chip). Body padding spacing/24 (compact spacing/16, flush 0), gap spacing/8.
        Title typography/font-size/18 semibold, text typography/font-size/16 in color/content/subtle. padding and Clip content are Figma
        only; code always clips media.
      category: '123:0'
    - label: >-
        One tab stop: an interactive card is one anchor or button; its title is the name. Never nest links or buttons inside it.

        Focus: focus-visible only, ring color/border/focus (blue/600 in Chip light), 4px wide with a 4px gap, outside; ring corner = card
        corner + 4 (the card+4 corner token is a pending decision).

        Contrast: text 7:1 or more in all four themes.
      category: '123:2'
  documentationLinks:
    - https://emcdanie.github.io/bella/?path=/docs/components-card--docs
