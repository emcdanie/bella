name: Button
lead:
  text: Chip tertiary (22 Nov, her pick E).
  source: tokens/contracts.json description, up to the first colon or semicolon
category: Actions
rendersAs: a button, or one anchor with href
links:
  storybook: https://emcdanie.github.io/bella/?path=/docs/components-actions-button--docs
  github: https://github.com/emcdanie/bella/blob/main/src/components/Button/Button.tsx
  storyTitle: Components/Actions/Button
props:
  - name: variant
    figmaName: variant
    type: '''primary'' | ''secondary'' | ''tertiary'''
    values:
      - primary
      - secondary
      - tertiary
    default: secondary
    required: false
    doc: >-
      Tier. `"primary"` is the flat ink plate, no shadow, never lifts; render at most ONE per view. `"secondary"` is the flat accent
      outline. `"tertiary"` is the text tier: no plate. BELLA themes: an ink label, hover lays a fill under it (Figma 26:320). Chip (her
      pick E, 22 Nov): dark brand blue text only, and hover, pressed and focus lay a pale blue wash under it and underline the label in
      blue. The neutral tier is retired; there is no fourth tier.
    at: src/components/Button/Button.tsx:12
  - name: shape
    type: '''default'' | ''pill'''
    values:
      - default
      - pill
    default: default
    required: false
    doc: >-
      Outline shape. `"default"` is border/radius/lg every tier shares (8 in Chip, the pill in BELLA); `"pill"` rounds the ends fully (e.g.
      a nav call to action).
    at: src/components/Button/Button.tsx:17
  - name: size
    figmaName: size
    type: '''default'' | ''md'' | ''sm'''
    values:
      - default
      - md
      - sm
    default: default
    required: false
    doc: >-
      `"sm"` is a 32 plate with 12px sides (Figma Button 26:320) for dense rows and tool bars. The label stays 16px and the 44px tap area
      stays, extended invisibly around the plate. With `iconOnly` it is a 32 square.
    at: src/components/Button/Button.tsx:23
  - name: label
    figmaName: Label
    type: ReactNode
    required: false
    doc: Figma "Label". The words on the button; `children` still works and wins when both are set.
    at: src/components/Button/Button.tsx:25
  - name: icon
    figmaName: icon
    type: IconName
    required: false
    doc: Figma "icon" (instance swap). An Icon registry name, drawn 20 in the label's ink.
    at: src/components/Button/Button.tsx:27
  - name: showIcon
    figmaName: Show icon
    type: boolean
    values:
      - true
      - false
    required: false
    doc: Figma "Show icon". Shows `icon` after the label (or alone with `iconOnly`). Defaults to on when `icon` is set.
    at: src/components/Button/Button.tsx:29
  - name: leadingIcon
    figmaName: Leading icon
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: Figma "Leading icon". Puts the icon before the label instead of after it.
    at: src/components/Button/Button.tsx:31
  - name: iconOnly
    figmaName: iconOnly
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      A 44 square (32 at sm) holding one Icon, corner border/radius/lg, ring following the corner (Figma Button 26:320). Needs `ariaLabel`,
      and a Tooltip with the same words.
    at: src/components/Button/Button.tsx:37
  - name: href
    type: string
    required: false
    doc: Renders the button as ONE anchor. External (http...) hrefs open in a new tab.
    at: src/components/Button/Button.tsx:39
  - name: onClick
    type: () => void
    required: false
    doc: Renders a real button. Ignored when `href` is set.
    at: src/components/Button/Button.tsx:41
  - name: type
    type: '''button'' | ''submit'''
    values:
      - button
      - submit
    default: button
    required: false
    doc: Button element type; `"submit"` for forms.
    at: src/components/Button/Button.tsx:43
  - name: disabled
    figmaName: disabled
    type: boolean
    values:
      - true
      - false
    required: false
    doc: 'Disabled state: muted surface, no elevation, no affordances. Buttons only, not links.'
    at: src/components/Button/Button.tsx:45
  - name: busy
    type: boolean
    values:
      - true
      - false
    default: false
    required: false
    doc: >-
      A job this button started is running ("Check again", "Test"): its icon turns (RefreshDouble, leading, when it has none), aria-busy is
      set and clicks wait until it is done. The label stays. Reduced motion: the icon holds still. Buttons only, not links.
    at: src/components/Button/Button.tsx:52
  - name: linkComponent
    type: ElementType
    default: a
    required: false
    doc: Component used to render internal links; inject your router's Link (e.g. next/link) at the consumer; defaults to a plain anchor.
    at: src/components/Button/Button.tsx:57
  - name: ariaLabel
    type: string
    required: false
    doc: Accessible name when the visible label isn't the right name.
    at: src/components/Button/Button.tsx:59
  - name: ariaExpanded
    type: boolean
    values:
      - true
      - false
    required: false
    doc: 'For a button that shows or hides content: whether that content is open (aria-expanded).'
    at: src/components/Button/Button.tsx:61
  - name: ariaPressed
    type: boolean
    values:
      - true
      - false
    required: false
    doc: >-
      For a toggle button (light or dark, mark up, compare in ToolColumn): whether it is on. On shows the pressed look, the same fill as
      hover (aria-pressed).
    at: src/components/Button/Button.tsx:63
  - name: ariaHaspopup
    type: '''dialog'''
    values:
      - dialog
    required: false
    doc: For a button that opens a dialog (aria-haspopup).
    at: src/components/Button/Button.tsx:65
  - name: className
    type: string
    required: false
    doc: Extra classes on the control.
    at: src/components/Button/Button.tsx:67
  - name: children
    type: ReactNode
    required: false
    at: src/components/Button/Button.tsx:68
