  annotations:
    - label: >-
        Dev · <Icon name size label /> · src/components/Icon/Icon.tsx:24. Paths from registry.ts only; no ids in the svg. Colour is
        currentColor (Icon.tsx:30): tone in Figma = parent text colour in code. Default size md (Icon.tsx:24); Figma picks the default by
        position, so md sits first in the grid. Glyph frame 16 / 20 / 24 (--icon-sm/md/lg), stroke 1.0 / 1.25 / 1.5. Pin, Code, Eye, Copy
        added 13 Nov from registry.ts:68-90.
      category: '123:0'
    - label: >-
        aria-hidden by default (decorative). With label: role=img + aria-label (Icon.tsx:32-34). Contrast rides on the tone token of the
        parent text.
      category: '123:2'
    - label: 'None: static, never animates.'
      category: '123:4'
