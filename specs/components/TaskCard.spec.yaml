      - false
    default: false
    required: false
    doc: >-
      Arrives (rule "Motion that shows what happened", items 4 and 6): a new card in Needs you, or one Undo brings back, pops in once on
      motion/duration/250 and motion/easing/pop. Set it only on the card that is new, never on first load. Reduced motion: it is simply
      there.
    at: src/components/TaskCard/TaskCard.tsx:66
  - name: leaving
    type: boolean
    values:
